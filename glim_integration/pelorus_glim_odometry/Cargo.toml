[package]
name = "pelorus_glim_odometry"
description = "Pelorus Odometry as a GLIM plugin."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[package.metadata.deb]
name = "libpelorus-glim-odometry"
depends = "libpelorus ( = $VERSION )"
section = "libs"
priority = "optional"
assets = [
    ["build/libodometry_estimation_pelorus.so", "usr/lib/libodometry_estimation_pelorus.so", "644"],
]

[package.metadata.generate-rpm]
name = "libpelorus-glim-odometry"
assets = [
    { source = "build/libodometry_estimation_pelorus.so", dest = "/usr/lib/libodometry_estimation_pelorus.so", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libpelorus = "= %{version}"
