[package]
name = "pelorus_metal"
description = "Metal GPU Accelerated Components for Pelorus Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
bytemuck.workspace = true
nalgebra.workspace = true
ros_pointcloud2.workspace = true
pelorus_core = { workspace = true, features = ["std"] }
log.workspace = true
libc.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["rayon"]
metal_available = []
rayon = ["dep:rayon"]
metal_enable = ["rayon", "dep:objc2", "dep:objc2-metal", "objc2-foundation"]
