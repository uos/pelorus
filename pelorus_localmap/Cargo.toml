[package]
name = "pelorus_localmap"
description = "Voxel Hash Map and Local Map Registration Primitives for Pelorus Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
ros_pointcloud2.workspace = true
nalgebra.workspace = true
serde.workspace = true
log.workspace = true
rayon = { workspace = true, optional = true }
bytemuck.workspace = true
rand.workspace = true
rand_distr.workspace = true
rand_pcg.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
pelorus_core.workspace = true

[features]
default = ["std", "rayon"]
std = [
  "pelorus_core/std",
  "nalgebra/std",
  "serde/std",
  "rand_distr/std",
  "rustc-hash/std",
]
rayon = ["std", "dep:rayon", "ros_pointcloud2/rayon"]
# Seed the neighbor sampling from the OS instead of a fixed seed, so runs on the same
# input differ. Not available in the browser.
os-rng-seed = ["std", "rand/os_rng"]
# Ablation: evict the least recently updated voxel instead of the least relevant (age / support).
lru-eviction = []
# Ablation: fuse scans into map cells by plain count-weighted merging instead of the maturity-weighted update.
plain-update = []
# Ablation: keep the update kernel width constant instead of narrowing it with the voxel's maturity.
