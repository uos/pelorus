[package]
name = "pelorus_core"
description = "Core Data Structures and Utilities for Pelorus Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
web-time = { version = "1.1", optional = true }
nalgebra.workspace = true
faer.workspace = true
ratslang = { workspace = true, optional = true }
either.workspace = true
ros_pointcloud2.workspace = true
serde.workspace = true
postcard.workspace = true
log.workspace = true
r2r = { workspace = true, optional = true }
bytemuck.workspace = true
hashbrown.workspace = true
spin.workspace = true

[features]
default = ["std"]
# Load `.rl` configurations, measure time with the system clock and use std types.
std = [
  "dep:ratslang",
  "dep:web-time",
  "anyhow/std",
  "nalgebra/std",
  "faer/std",
  "either/std",
  "ros_pointcloud2/std",
  "serde/std",
]
r2r = ["std", "dep:r2r"]
