[package]
name = "pelorus_c"
description = "Pelorus Odometry as a C library."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pelorus = { workspace = true, default-features = false, features = ["threads"] }
log.workspace = true

[build-dependencies]
cbindgen.workspace = true

[features]
default = ["rayon"]
rayon = ["pelorus/rayon"]
downsample = ["pelorus/downsample"]
cuda = ["pelorus/cuda"]
metal = ["pelorus/metal"]
vulkan = ["pelorus/vulkan"]
no-imu-sync = ["pelorus/no-imu-sync"]
large-processing-queue = ["pelorus/large-processing-queue"]

[package.metadata.deb]
name = "libpelorus"
section = "libs"
priority = "optional"
assets = [
    ["target/release/libpelorus.so", "usr/lib/libpelorus.so", "644"],
    ["target/release/libpelorus.a", "usr/lib/libpelorus.a", "644"],
]

[package.metadata.generate-rpm]
name = "libpelorus"
assets = [
    { source = "target/release/libpelorus.so", dest = "/usr/lib/libpelorus.so", mode = "644" },
    { source = "target/release/libpelorus.a", dest = "/usr/lib/libpelorus.a", mode = "644" },
]
