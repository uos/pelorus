[package]
name = "pelorus_c"
description = "Pelorus Odometry as a C library."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
pelorus.workspace = true
log.workspace = true

[build-dependencies]
cbindgen = "0.29"

[features]
default = []
downsample = ["pelorus/downsample"]
cuda = ["pelorus/cuda"]
metal = ["pelorus/metal"]
no-imu-sync = ["pelorus/no-imu-sync"]

[package.metadata.deb]
name = "libpelorus"
section = "libs"
priority = "optional"
assets = [
    ["target/release/libpelorus.so", "usr/lib/libpelorus.so", "644"],
    ["target/release/libpelorus.a", "usr/lib/libpelorus.a", "644"],
]
