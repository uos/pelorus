[package]
name = "pelorus_c"
description = "C FFI bindings for Pelorus"
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# pelorus.workspace = true
prelio.workspace = true
pelorus_core.workspace = true
# prelio-ros2 = { workspace = true, features = ["ratpub"] } # ratpub is not used in the library, but a communcation feature is needed to build this crate
pelorus_reg.workspace = true
spole.workspace = true
ros_pointcloud2 = { workspace = true, features = ["ros2-interfaces-jazzy-serde"] }
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
log.workspace = true
ratslang.workspace = true

[features]
default = ["downsample", "parallel"]
downsample = ["prelio/downsample"]
parallel = ["prelio/parallel", "pelorus_reg/parallel"]
cuda = ["prelio/cuda", "pelorus_reg/cuda"]
no-imu-sync = ["prelio/no-imu-sync"]
