[package]
name = "pelorus_c"
description = "Pelorus Odometry as a C library."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"
crate-type = ["cdylib", "staticlib"]

[dependencies]
prelio.workspace = true
pelorus_core.workspace = true
pelorus_reg.workspace = true
spole.workspace = true
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
log.workspace = true
ratslang.workspace = true

[features]
default = ["parallel"]
downsample = ["prelio/downsample"]
parallel = ["prelio/parallel", "pelorus_reg/parallel"]
cuda = ["prelio/cuda", "pelorus_reg/cuda"]
no-imu-sync = ["prelio/no-imu-sync"]

[package.metadata.deb]
name = "libpelorus"
section = "libs"
priority = "optional"
assets = [
    ["target/release/libpelorus.so", "usr/lib/libpelorus.so", "644"],
    ["target/release/libpelorus.a", "usr/lib/libpelorus.a", "644"],
]
