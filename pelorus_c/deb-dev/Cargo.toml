[package]
name = "libpelorus-dev"
description = "Pelorus Odometry as a C library."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
rust-version.workspace = true

[package.metadata.deb]
name = "libpelorus-dev"
section = "libs"
priority = "optional"
depends = "libpelorus ( = $VERSION )"
preserve-symlinks = false
assets = [
    ["pelorus.h", "usr/include/pelorus.h", "644"],
    ["pelorus.hpp", "usr/include/pelorus.hpp", "644"],
    ["pelorus.pc", "usr/lib/pkgconfig/pelorus.pc", "644"],
    ["pelorusConfig.cmake", "usr/lib/cmake/pelorus/pelorusConfig.cmake", "644"],
    ["pelorusConfigVersion.cmake", "usr/lib/cmake/pelorus/pelorusConfigVersion.cmake", "644"],
]

[package.metadata.generate-rpm]
name = "libpelorus-dev"
assets = [
    { source = "pelorus.h", dest = "/usr/include/pelorus.h", mode = "644" },
    { source = "pelorus.hpp", dest = "/usr/include/pelorus.hpp", mode = "644" },
    { source = "pelorus.pc", dest = "/usr/lib/pkgconfig/pelorus.pc", mode = "644" },
    { source = "pelorusConfig.cmake", dest = "/usr/lib/cmake/pelorus/pelorusConfig.cmake", mode = "644" },
    { source = "pelorusConfigVersion.cmake", dest = "/usr/lib/cmake/pelorus/pelorusConfigVersion.cmake", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libpelorus = "= %{version}"
