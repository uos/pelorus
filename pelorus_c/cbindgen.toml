# cbindgen configuration — generates pelorus.h from pelorus_c/src/lib.rs

language = "C"
header = "/* Pelorus C Library - Resource-Aware Lidar-Inertial Odometry\n *\n * Threading and async processing are handled internally.\n *\n * Warning: This file is auto-generated by cbindgen. Do not edit manually.\n */"
include_guard = "PELORUS_H"
pragma_once = true
cpp_compat = true
no_includes = true
sys_includes = ["stdarg.h", "stdbool.h", "stdint.h", "stdlib.h"]

# Macro that must appear after pelorus_create_options is defined.
trailer = """
#define PELORUS_CREATE_OPTIONS_DEFAULT \\
  {.config_path = NULL, .device_specific_pointcloud2 = 1}"""

[export]
include = ["PelorusStatus"]
exclude = []

[export.rename]
# Map the Rust PascalCase enum name to the C snake_case convention.
"PelorusStatus" = "pelorus_status"

[enum]
# Prefix each variant with the enum name: PelorusStatus::OK -> PELORUS_STATUS_OK
rename_variants = "QualifiedScreamingSnakeCase"

[fn]

[struct]

[parse]
parse_deps = false
include = []
extra_bindings = []
