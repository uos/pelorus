[package]
name = "pelorus_cli"
description = "Highly efficient Lidar Inertial Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
prelio_io = { workspace = true, default-features = false }
pelorus_cuda = { optional = true, workspace = true }
pelorus_metal = { optional = true, workspace = true }
pelorus_vulkan = { optional = true, workspace = true }
prelio = { workspace = true, default-features = false }
pelorus_reg = { workspace = true, default-features = false }
ros_pointcloud2.workspace = true
ros2-client = { workspace = true, optional = true }
mcap = { workspace = true }
cdr = { workspace = true }
nalgebra.workspace = true
anyhow.workspace = true
rand.workspace = true
either.workspace = true
env_logger.workspace = true
log.workspace = true
ros2-interfaces-jazzy-serde = { workspace = true }
rerun = { workspace = true, optional = true }
futures-lite.workspace = true
mimalloc = { workspace = true, optional = true }
clap.workspace = true
r2r = { workspace = true, optional = true }
mt_pubsub = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
mt_rat = { workspace = true, optional = true }
rustc-hash.workspace = true
ratslang.workspace = true
petname.workspace = true
colorous.workspace = true
ratatui.workspace = true
crossterm.workspace = true
num_cpus.workspace = true
libc.workspace = true
rayon = { workspace = true, optional = true }
marina = { workspace = true, optional = true }
clap_complete.workspace = true
serde.workspace = true

[[bin]]
name = "pelorus"
path = "src/main.rs"

[features]
default = [
  "offline",
  "rayon",
] # rerun needs newer rustc versions, so only enable it manually

rayon = [
  "dep:rayon",
  "prelio_io/rayon",
  "prelio/rayon",
  "pelorus_reg/rayon",
  "ros_pointcloud2/rayon",
  "pelorus_cuda?/rayon",
  "pelorus_vulkan?/rayon",
]

# -#-#-#-#-#- Sensor Communication -#-#-#-#-#-

# Alias for default fallback
ros2 = ["ros2c"]

# ROS2 Node via C bindings. See the lio.toml for controlling QoS.
ros2c = ["r2r"]

# ROS2 with Rust native implementation. No ROS2 installation required. See the lio.toml for controlling QoS.
ros2-rust = ["ros2-client"]

# Custom Rust-only pub/sub implementation used in my offline-mapping, development and debugging workflow (see https://uos.github.io/minot/#native-publishsubscribe).
mt_pubsub = [
  "dep:mt_pubsub",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
  "prelio_io/mt_pubsub",
]

# -#-#-#-#-#- Performance and Methods -#-#-#-#-#-

# The input scan is reduced for faster registration (resolution affects accuracy)
downsample = ["prelio_io/downsample"]

# Build and use CUDA accelerations
cuda = [
  "prelio_io/cuda",
  "dep:pelorus_cuda",
  "pelorus_reg/cuda",
  "pelorus_cuda/cuda_enable",
]
cuda-sort-thrust = ["cuda", "pelorus_cuda/cuda_sort_thrust"]
metal = [
  "prelio_io/metal",
  "prelio/metal",
  "dep:pelorus_metal",
  "pelorus_reg/metal",
  "pelorus_metal/metal_available",
  "pelorus_metal/metal_enable",
]
vulkan = [
  "prelio_io/vulkan",
  "prelio/vulkan",
  "dep:pelorus_vulkan",
  "pelorus_reg/vulkan",
  "pelorus_vulkan/vulkan_available",
  "pelorus_vulkan/vulkan_enable",
]

# Lidar + IMU with naiive kdtree for neighborsearch. Currently slow and unstable. Use only with good reason.
kdtree = ["pelorus_reg/nn_kdt"]

# Enables synchronization with a bagfile using Minot (https://uos.github.io/minot/)
offline = ["mt_pubsub", "rat"]

# Use Mimalloc as allocator. General speedup when using dynamic memory.
mimalloc = ["dep:mimalloc"]

# Export one processing-time sample per odometry output.
processing-time-export = ["pelorus_reg/processing-time-export"]

# -#-#-#-#-#- Visualizations -#-#-#-#-#-

# Visualize data with rerun. Set the `RERUN_SERVER_ADDR` env variable to your rerun instance, default is '127.0.0.1:9876'.
rerun = ["dep:rerun", "prelio_io/rerun"]

# Publish the localmap. WARNING: You should only enable this for debugging or you want to fiddle with the config. Getting the map is inefficient and unoptimized.
map = []

# Skips publishing any visualizations that take too much compute resources (e.g. iterating a point cloud)
no-viz = []

# Enable the visualization tools for comparing against ground truths.

# -#-#-#-#-#- Low level -#-#-#-#-#-

# Toggle tooling typically used for development
dev = ["offline", "rerun", "map"]

# Use variable syncing for triggers
rat = ["dep:marina", "dep:mt_rat", "dep:tokio", "prelio_io/rat"]

# Use native ROS2 as pub/sub system
ros2-client = [
  "dep:ros2-client",
  "prelio_io/ros2-client",
]

# Use rclc bindings as pub/sub system
r2r = ["dep:r2r", "prelio_io/r2r"]

[build-dependencies]
anyhow.workspace = true
env_logger.workspace = true
pelorus_core = { path = "../pelorus_core" }
ratslang.workspace = true

[package.metadata.deb]
name = "pelorus"
depends = "minot (>= 0.8.0), minot (<< 0.9.0~)"
section = "science"
priority = "optional"
assets = [["target/release/pelorus", "usr/bin/pelorus", "755"]]

[package.metadata.generate-rpm]
name = "pelorus"
assets = [{ source = "target/release/pelorus", dest = "/usr/bin/pelorus", mode = "755" }]

[package.metadata.generate-rpm.requires]
minot = ">= 0.8.0, < 0.9.0"

[package.metadata.multivers.x86_64]
cpus = [
  "x86-64",
  "x86-64-v2", # SSE
  "x86-64-v3", # AVX + a lot more
  "x86-64-v4", # AVX 512 High End CPUs
  "raptorlake", # my workstation
  "pantherlake", # newest intel arch
  "znver5", # newest amd arch
]

[package.metadata.multivers.aarch64]
cpus = [
  "generic",
  "neoverse-v3ae", # Jetson Thor (automotive enhanced)
  "cortex-a78ae",  # Jetson Orin
  "apple-m1",
  "apple-m2",
  "apple-m3",
  "apple-m4",
  "apple-m5",
]
