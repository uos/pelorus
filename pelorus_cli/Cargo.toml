[package]
name = "pelorus_cli"
description = "Resource-aware Lidar-Inertial Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
imu-calib.workspace = true
pelorus_core.workspace = true
pelorus_syncio = { workspace = true, default-features = false }
pelorus_cuda = { optional = true, workspace = true }
pelorus_metal = { optional = true, workspace = true }
pelorus_vulkan = { optional = true, workspace = true }
pelorus_sync = { workspace = true, default-features = false }
pelorus_reg = { workspace = true, default-features = false }
pelorus_localmap = { workspace = true, default-features = false }
ros_pointcloud2.workspace = true
ros2-client = { workspace = true, optional = true }
mcap = { workspace = true }
cdr = { workspace = true }
nalgebra.workspace = true
anyhow.workspace = true
ureq.workspace = true
rand.workspace = true
either.workspace = true
env_logger.workspace = true
log.workspace = true
ros2-interfaces-jazzy-serde = { workspace = true }
rerun = { workspace = true, optional = true }
futures-lite.workspace = true
mimalloc = { workspace = true, optional = true }
clap.workspace = true
r2r = { workspace = true, optional = true }
mt_pubsub = { workspace = true, optional = true }
mt_service = { workspace = true, optional = true }
mt_log.workspace = true
pelorus_protocol.workspace = true
hiroz = { workspace = true, optional = true }
hiroz-msgs = { workspace = true, optional = true }
hiroz-protocol = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
mt_rat = { workspace = true, optional = true }
rustc-hash.workspace = true
ratslang.workspace = true
petname.workspace = true
colorous.workspace = true
ratatui.workspace = true
crossterm.workspace = true
num_cpus.workspace = true
libc.workspace = true
rayon = { workspace = true, optional = true }
clap_complete.workspace = true
serde.workspace = true

[[bin]]
name = "pelorus"
path = "src/main.rs"

[features]
default = [
  "compressed-pointcloud",
  "offline",
  "processing-time-export",
  "rayon",
  "rerun",
]

rayon = [
  "dep:rayon",
  "pelorus_syncio/rayon",
  "pelorus_sync/rayon",
  "pelorus_reg/rayon",
  "ros_pointcloud2/rayon",
  "pelorus_cuda?/rayon",
  "pelorus_vulkan?/rayon",
]

# -#-#-#-#-#- Sensor Communication -#-#-#-#-#-

# Native drivers are opt-in; Disabled in Ratslang preserves external subscriptions.
native-drivers = ["pelorus_syncio/native-drivers"]
velodyne-driver = ["native-drivers", "pelorus_syncio/velodyne-driver"]
xsens-driver = ["native-drivers", "pelorus_syncio/xsens-driver"]
ouster-driver = ["native-drivers", "pelorus_syncio/ouster-driver"]
robosense-driver = ["native-drivers", "pelorus_syncio/robosense-driver"]
sensor-drivers = [
  "velodyne-driver",
  "xsens-driver",
  "ouster-driver",
  "robosense-driver",
]

# Alias for default fallback
ros2 = ["ros2c"]

# ROS2 Node via C bindings. See the lio.toml for controlling QoS.
ros2c = ["r2r", "processing-time-export"]

# ROS2 with Rust native implementation. No ROS2 installation required. See the lio.toml for controlling QoS.
ros2-rust = ["ros2-client", "processing-time-export"]

# Custom Rust-only pub/sub implementation used in my offline-mapping, development and debugging workflow (see https://uos.github.io/minot/#native-publishsubscribe).
mt_pubsub = [
  "dep:mt_pubsub",
  "dep:mt_service",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
  "pelorus_syncio/mt_pubsub",
]

# Cloudini-compressed point-cloud transport for mt_pubsub. Uses the pure-Rust codec.
compressed-pointcloud = ["mt_pubsub", "pelorus_syncio/compressed-pointcloud"]

# Pure Rust ROS 2-compatible communication over Zenoh via Hiroz.
hiroz = [
  "dep:hiroz",
  "dep:hiroz-msgs",
  "dep:hiroz-protocol",
  "dep:tokio",
  "pelorus_syncio/hiroz",
]

# -#-#-#-#-#- Performance and Methods -#-#-#-#-#-

# The input scan is reduced for faster registration (resolution affects accuracy)
downsample = ["pelorus_syncio/downsample"]

# Build and use CUDA accelerations
cuda = [
  "pelorus_syncio/cuda",
  "dep:pelorus_cuda",
  "pelorus_reg/cuda",
  "pelorus_cuda/cuda_enable",
]
metal = [
  "pelorus_syncio/metal",
  "pelorus_sync/metal",
  "dep:pelorus_metal",
  "pelorus_reg/metal",
  "pelorus_metal/metal_available",
  "pelorus_metal/metal_enable",
]
vulkan = [
  "pelorus_syncio/vulkan",
  "pelorus_sync/vulkan",
  "dep:pelorus_vulkan",
  "pelorus_reg/vulkan",
  "pelorus_vulkan/vulkan_available",
  "pelorus_vulkan/vulkan_enable",
]

# Lidar + IMU with naiive kdtree for neighborsearch. Currently slow and unstable. Use only with good reason.
kdtree = ["pelorus_reg/nn_kdt"]

# Ablation: plain LRU local-map eviction (least recently updated first) instead of age / support relevance. CPU maps only.
lru-eviction = ["pelorus_reg/lru-eviction", "pelorus_localmap/lru-eviction"]
plain-update = ["pelorus_reg/plain-update", "pelorus_localmap/plain-update"]

# Enables synchronization with a bagfile using Minot (https://uos.github.io/minot/)
offline = ["mt_pubsub", "rat"]

# Enables offline processing while using Hiroz instead of mt_pubsub for IO.
offline-hiroz = ["hiroz", "rat"]

# Use Mimalloc as allocator. General speedup when using dynamic memory.
mimalloc = ["dep:mimalloc"]

# Export one processing-time sample per odometry output.
processing-time-export = ["pelorus_reg/processing-time-export"]

# Use much larger bounded queues between input, preprocessing, synchronization,
# and registration stages. Intended for stress tests or intentionally buffered
# offline runs; default capacities are much smaller.
large-processing-queue = [
  "pelorus_syncio/large-processing-queue",
  "pelorus_sync/large-processing-queue",
]

# -#-#-#-#-#- Visualizations -#-#-#-#-#-

# Compile Rerun visualization support. Activate it at runtime with `output.rerun = true`.
# Connection and map settings live under `output.rerun` in the config.
rerun = ["dep:rerun", "pelorus_syncio/rerun"]

# Skips publishing any visualizations that take too much compute resources (e.g. iterating a point cloud)
no-viz = []

# Enable the visualization tools for comparing against ground truths.

# -#-#-#-#-#- Low level -#-#-#-#-#-

# Toggle tooling typically used for development
dev = ["offline", "rerun"]

# Use variable syncing for triggers
rat = ["dep:mt_rat", "dep:tokio", "pelorus_syncio/rat"]

# Use native ROS2 as pub/sub system
ros2-client = ["dep:ros2-client", "pelorus_syncio/ros2-client"]

# Use rclc bindings as pub/sub system
r2r = ["dep:r2r", "pelorus_syncio/r2r"]

[build-dependencies]
anyhow.workspace = true
env_logger.workspace = true
pelorus_core.workspace = true
ratslang.workspace = true

[package.metadata.deb]
name = "pelorus"
depends = "minot (>= 0.13.0), minot (<< 0.14.0~), dedrunk, marina"
section = "science"
priority = "optional"
assets = [["target/release/pelorus", "usr/bin/pelorus", "755"]]

[package.metadata.generate-rpm]
name = "pelorus"
assets = [
  { source = "target/release/pelorus", dest = "/usr/bin/pelorus", mode = "755" },
]

[package.metadata.generate-rpm.requires]
minot = ">= 0.13.0, < 0.14.0"

[package.metadata.multivers.x86_64]
cpus = [
  "x86-64",
  "x86-64-v2",   # SSE
  "x86-64-v3",   # AVX + a lot more
  "x86-64-v4",   # AVX 512 High End CPUs
  "raptorlake",  # my workstation
  "pantherlake", # newest intel arch
  "znver5",      # newest amd arch
]

[package.metadata.multivers.aarch64]
cpus = [
  "generic",
  "neoverse-v3ae", # Jetson Thor (automotive enhanced)
  "cortex-a78ae",  # Jetson Orin
  "apple-m1",
  "apple-m2",
  "apple-m3",
  "apple-m4",
  "apple-m5",
]
