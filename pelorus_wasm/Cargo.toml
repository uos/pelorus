[package]
name = "pelorus_wasm"
description = "WebAssembly bindings for Pelorus Lidar-Inertial Odometry."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
webgpu = ["pelorus/webgpu", "dep:wasm-bindgen-futures", "dep:gloo-timers"]

[dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }
pelorus = { workspace = true, features = ["std"] }
bytemuck.workspace = true
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
console_error_panic_hook = "0.1"
mcap.workspace = true
cdr.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
ros_pointcloud2.workspace = true
cloudini.workspace = true
rustc-hash = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
anyhow.workspace = true
futures-lite.workspace = true
serde_json.workspace = true

[[example]]
name = "benchmark_wgpu"
required-features = ["webgpu"]
