# Eq-LIO (ROS 2 port) config for helipr_bridge02_ouster.
# All parameters shared with FAST-LIO2 are copied verbatim from FAST_LIO_ROS2/config/helipr_bridge02_ouster.yaml so both
# methods run with identical settings. The cov/others blocks are Eq-LIO specific and set to the upstream
# defaults (Eq-LIO config/avia.yaml and velodyne.yaml; the upstream ouster64.yaml has no cov block).
/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 1
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./helipr_bridge02_ouster.pcd"
    common:
      lid_topic: "/ouster/points"
      imu_topic: "/imu/data_raw"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0
    preprocess:
      lidar_type: 3
      scan_line: 128
      timestamp_unit: 3
      blind: 4.0
    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 150.0
      extrinsic_est_en: false
      extrinsic_T: [-0.41696532, -0.00301141, 0.2996]
      extrinsic_R: [0.999715495593027, 0.0223448061210468, -0.00834490926264448,
                    -0.0224514077723064, 0.999664614804883, -0.0129070599303583,
                    0.00805370475188661, 0.0130907427756056, 0.999881878170293]
    publish:
      path_en: false
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
    traj_save:
      traj_save_en: true
      traj_save_path: "eqlio_helipr_bridge02_ouster_trajectory.txt"
    latency_save:
      latency_save_en: true
      latency_save_path: "eqlio_helipr_bridge02_ouster_latency.txt"
    cov:
      lidar_point_cov: 0.001            # Eq-LIO upstream default (same value as FAST-LIO2 LASER_POINT_COV)
      # initial covariance diagonal, order: pos, rot, extrinsic rot, extrinsic trans, vel, bg, ba, grav
      init_P: [1.0, 1.0, 0.00001, 0.00001, 1.0, 0.0001, 0.001, 0.00001]
    others:
      grav_S2: true                     # Eq-LIO upstream default: gravity on S2 (23-dim filter)
