kiss_icp_node:
  ros__parameters:
    base_frame: ""
    lidar_odom_frame: "odom_lidar"
    publish_odom_tf: true
    invert_odom_tf: false
    position_covariance: 0.1
    orientation_covariance: 0.1
    tum_trajectory_path: "kiss_icp_oxford_spires_pelorus_trajectory.txt"
    latency_save: true
    latency_file: "kiss_icp_oxford_spires_pelorus_latency.txt"

    data:
      deskew: false
      min_range: 4.0
      max_range: 150.0

    mapping:
      voxel_size: 0.5
      max_points_per_voxel: 20

    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1

    registration:
      max_num_iterations: 500
      convergence_criterion: 0.0001
      max_num_threads: 0
