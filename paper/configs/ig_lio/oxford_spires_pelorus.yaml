lidar_topic: /hesai/pandar
imu_topic: /alphasense_driver_ros/imu
lidar_type: hesai
min_radius: 4.0
max_radius: 150.0
point_filter_num: 1
time_scale: 1.0
enable_ahrs_initalization: false
enable_acc_correct: false

scan_resolution: 0.5
voxel_map_resolution: 0.5
max_iterations: 10

acc_cov: 0.1
gyr_cov: 0.1
ba_cov: 0.0001
bg_cov: 0.0001

gicp_constraints_gain: 100.0
point2plane_constraints_gain: 1000.0
enable_undistort: true
enable_outlier_rejection: true

gravity: 9.80665
init_ori_cov: 0.0001
init_pos_cov: 0.0001
init_vel_cov: 100.0
init_ba_cov: 0.000001
init_bg_cov: 0.000001
init_imu_samples: 40
# the handheld rig already moves at startup, so the biases cannot be taken from the IMU mean
init_bias_from_imu: false

# Oxford Spires Hesai Pandar, LiDAR frame to IMU/base frame.
t_imu_lidar: [-0.00065171, -0.01551034, 0.08463266]
R_imu_lidar: [-0.01663805, -0.99986011, 0.00171598,
              0.99985526, -0.01663181, 0.00358431,
             -0.00355527, 0.00177537, 0.9999921]

traj_save.traj_save_en: true
traj_save.traj_save_path: oxford_spires_pelorus_iglio_tum.txt
latency_save.latency_save_en: true
latency_save.latency_save_path: oxford_spires_pelorus_iglio_latency.txt
