/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 1
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./oxford_spires_pelorus.pcd"
    common:
      lid_topic: "/hesai/pandar"
      imu_topic: "/alphasense_driver_ros/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0
    preprocess:
      lidar_type: 5
      scan_line: 64
      timestamp_unit: 3
      blind: 4.0
    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 150.0
      extrinsic_est_en: false
      extrinsic_T: [-0.00065171, -0.01551034, 0.08463266]
      extrinsic_R: [-0.01663805, -0.99986011, 0.00171598,
                    0.99985526, -0.01663181, 0.00358431,
                    -0.00355527, 0.00177537, 0.9999921]
    publish:
      path_en: false
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
    traj_save:
      traj_save_en: true
      traj_save_path: "fastlio_oxford_spires_pelorus_trajectory.txt"
    latency_save:
      latency_save_en: true
      latency_save_path: "oxford_spires_pelorus_latency.txt"
