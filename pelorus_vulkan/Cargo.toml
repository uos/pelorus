[package]
name = "pelorus_vulkan"
description = "Vulkan Accelerated Components for Pelorus Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ash.workspace = true
bytemuck.workspace = true
nalgebra.workspace = true
ros_pointcloud2.workspace = true
pelorus_core.workspace = true
spole = { workspace = true, default-features = false }
log.workspace = true
shaderc = { workspace = true, optional = true }

[build-dependencies]
pkg-config.workspace = true
cc.workspace = true

[features]
default = ["rayon"]
rayon = ["spole/rayon", "ros_pointcloud2/rayon"]
vulkan_available = []
vulkan_enable = ["dep:shaderc"]
