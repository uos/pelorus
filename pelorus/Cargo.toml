[package]
name = "pelorus"
description = "Rust API for Pelorus LiDAR-Inertial Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"

[dependencies]
pelorus_core.workspace = true
pelorus_reg.workspace = true
prelio.workspace = true
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
log.workspace = true
ratslang.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["parallel"]
downsample = ["prelio/downsample"]
parallel = ["prelio/parallel", "pelorus_reg/parallel", "dep:rayon"]
cuda = ["prelio/cuda", "pelorus_reg/cuda"]
no-imu-sync = ["prelio/no-imu-sync"]
