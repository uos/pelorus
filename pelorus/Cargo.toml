[package]
name = "pelorus_sdk"
description = "Rust API for Pelorus Lidar-Inertial Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"

[dependencies]
pelorus_core.workspace = true
pelorus_reg = { workspace = true, default-features = false }
pelorus_sync = { workspace = true, default-features = false }
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
ureq.workspace = true
log.workspace = true
ratslang.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["rayon"]
processing-time-export = ["pelorus_reg/processing-time-export"]
rayon = ["dep:rayon", "pelorus_sync/rayon", "pelorus_reg/rayon", "ros_pointcloud2/rayon"]
downsample = ["pelorus_sync/downsample"]
cuda = ["pelorus_sync/cuda", "pelorus_reg/cuda"]
metal = ["pelorus_sync/metal", "pelorus_reg/metal"]
vulkan = ["pelorus_sync/vulkan", "pelorus_reg/vulkan"]
no-imu-sync = ["pelorus_sync/no-imu-sync"]
large-processing-queue = ["pelorus_sync/large-processing-queue"]
lru-eviction = ["pelorus_reg/lru-eviction"]
plain-update = ["pelorus_reg/plain-update"]
no-maturity-decay = ["pelorus_reg/no-maturity-decay"]
no-level-consistency = ["pelorus_reg/no-level-consistency"]
