[package]
name = "pelorus"
description = "Rust API for Pelorus LiDAR-Inertial Odometry."
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus"

[dependencies]
pelorus_core.workspace = true
pelorus_reg = { workspace = true, default-features = false }
prelio = { workspace = true, default-features = false }
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
log.workspace = true
ratslang.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

[features]
default = ["rayon"]
processing-time-export = ["pelorus_reg/processing-time-export"]
rayon = ["dep:rayon", "prelio/rayon", "pelorus_reg/rayon", "ros_pointcloud2/rayon"]
downsample = ["prelio/downsample"]
cuda = ["prelio/cuda", "pelorus_reg/cuda"]
metal = ["prelio/metal", "pelorus_reg/metal"]
vulkan = ["prelio/vulkan", "pelorus_reg/vulkan"]
no-imu-sync = ["prelio/no-imu-sync"]
large-processing-queue = ["prelio/large-processing-queue"]
