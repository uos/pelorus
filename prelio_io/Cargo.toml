[package]
name = "prelio_io"
description = "IO layer for prelio"

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
ros_pointcloud2.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
futures-lite.workspace = true
prelio.workspace = true
log.workspace = true
env_logger.workspace = true
ros2-client = { workspace = true, optional = true }
ros2-interfaces-jazzy-serde = { workspace = true, optional = true }
thiserror.workspace = true
r2r = { workspace = true, optional = true }
rerun = { workspace = true, optional = true }
ratpub = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
mt_rat = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }

[features]
rat = ["dep:mt_rat", "dep:libc"]
downsample = ["prelio/downsample"]
cuda = ["prelio/cuda"]
metal = ["prelio/metal"]
no-imu-sync = ["prelio/no-imu-sync"]
rerun = ["dep:rerun"]
ratpub = [
  "dep:ratpub",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
]
ros2-client = [
  "dep:ros2-client",
  "dep:ros2-interfaces-jazzy-serde",
]
r2r = ["dep:r2r", "pelorus_core/r2r"]
