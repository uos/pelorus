[package]
name = "prelio"
description = "Normalizing and synchronizing Lidar and IMU measurements for odometry estimation, including pre-integration."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
pelorus_cuda = { optional = true, workspace = true }
pelorus_metal = { optional = true, workspace = true }
ros_pointcloud2.workspace = true
log.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
sophus_lie.workspace = true
rayon.workspace = true
either.workspace = true
rand.workspace = true
imu-fusion.workspace = true
imu-calib.workspace = true
morton-encoding.workspace = true

[features]
downsample = []
cuda = ["dep:pelorus_cuda", "pelorus_cuda/cuda_available", "pelorus_cuda/cuda_enable"]
metal = ["dep:pelorus_metal", "pelorus_metal/metal_available", "pelorus_metal/metal_enable"]
no-imu-sync = []
default = []
