[package]
name = "pelorus_web"
description = "Browser demo of Pelorus Lidar-Inertial Odometry."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
webgpu = ["pelorus_wasm/webgpu"]

[dependencies]
pelorus_wasm = { path = "../pelorus_wasm" }
pelorus_tui.workspace = true
pelorus_core = { workspace = true, features = ["std"] }
mt_log.workspace = true
ratzilla = "0.3.1"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
console_error_panic_hook = "0.1"
serde.workspace = true
