# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: backends

on:
  push:
  pull_request:

env:
  RUST_FONTCONFIG_DLOPEN: 1

jobs:
  apple:
    runs-on: macos-latest
    env:
      DATASET: wachsbleiche:hunter:parking_25
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup update
      - name: Install SeaKit
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install minot-cli marina-cli sounding-cli
      - name: Download dataset
        run: |
          source .venv/bin/activate
          marina pull -y $DATASET
      - name: Equivalence
        run: |
          source .venv/bin/activate
          ./scripts/compare-backends-offline.bash --backends metal "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"

  nvidia:
    runs-on: noble
    env:
      DATASET: wachsbleiche:hunter:parking_25
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup update
      - name: Install SeaKit
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install minot-cli marina-cli sounding-cli
      - name: Download dataset
        run: |
          source .venv/bin/activate
          marina pull -y $DATASET
      - name: Equivalence
        run: |
          source .venv/bin/activate
          ./scripts/compare-backends-offline.bash --backends cuda,vulkan "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"
