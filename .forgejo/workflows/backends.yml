# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: backends

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

env:
  RUST_FONTCONFIG_DLOPEN: 1

jobs:
  apple:
    runs-on: macos-latest
    env:
      DATASET: wachsbleiche/parking_25:hunter
      MARINA_CONFIG_DIR: ${{ github.workspace }}/ci/marina
      MARINA_CACHE_DIR: /tmp/marina-cache
      MARINA_SSH_KEY: "/Users/ti/.ssh/id_ed25519"
      MARINA_SSH_TRANSPORT: "openssh"
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
      - name: Install SeaKit
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install minot-cli marina-cli sounding-cli
      - name: Trust Marina registry host
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cp ci/marina/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Download dataset
        run: |
          source .venv/bin/activate
          set -x

          which marina
          marina --version || true
          pip show marina-cli || true

          nc -vz 131.173.32.180 22
          ssh -o BatchMode=yes -o ConnectTimeout=5 131.173.32.180 true || true

          marina registry ls

          marina pull -y $DATASET
      - name: Equivalence
        run: |
          source .venv/bin/activate
          # Single and multi-resolution can't run in parallel (both build target/release/pelorus), so they run one after another here.
          ./scripts/compare-backends-offline.bash --backends metal "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"
          ./scripts/compare-backends-offline.bash --multiresolution --backends metal "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"

  nvidia:
    runs-on: noble
    env:
      DATASET: wachsbleiche/parking_25:hunter
      MARINA_CONFIG_DIR: ${{ github.workspace }}/ci/marina
      MARINA_CACHE_DIR: /tmp/marina-cache
      MARINA_SSH_KEY: "/home/runner/.ssh/id_ed25519"
      CUDA_HOME: "/usr/local/cuda"
      MARINA_SSH_TRANSPORT: "openssh"
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: |
          . "$HOME/.cargo/env"
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
      - name: Install build and SeaKit tools
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install cmake minot-cli marina-cli sounding-cli
      - name: Trust Marina registry host
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cp ci/marina/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Download dataset
        run: |
          source .venv/bin/activate
          marina pull -y $DATASET
      - name: Equivalence
        run: |
          . "$HOME/.cargo/env"
          source .venv/bin/activate
          # Single and multi-resolution can't run in parallel (both build target/release/pelorus), so they run one after another here.
          ./scripts/compare-backends-offline.bash --backends cuda,vulkan "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"
          ./scripts/compare-backends-offline.bash --multiresolution --backends cuda,vulkan "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"
