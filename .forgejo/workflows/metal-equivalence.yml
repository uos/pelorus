# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
# Metal equivalence test workflow - runs on every push and PR

name: metal-equivalence

on:
  push:
    branches:
      - main
      - dev
      - "feature/*"
      - "fix/*"
  pull_request:
    branches:
      - main
      - dev

env:
  RUST_FONTCONFIG_DLOPEN: 1

jobs:
  metal-equivalence-test:
    runs-on: macos-latest
    env:
      DATASET: wachsbleiche:hunter:parking_25
    steps:
      - name: Update Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup update
      - name: Install SeaKit
        run: |
          brew tap uos/marina
          brew tap uos/sounding
          brew tap uos/minot
          brew update
          brew install marina sounding minot
      - name: Download dataset
        run: |
          marina pull -y $DATASET
      - uses: actions/checkout@v4
      - name: Build Metal-enabled Pelorus
        run: |
          cargo build --release --package pelorus_cli --features metal
      - name: Metal equivalence test
        run: |
          ./scripts/compare-backends-offline.bash --backends metal "$(marina resolve -y $DATASET)" "$(marina resolve -y $DATASET)/pelorus.rl"
      # - name: Cleanup
      #   run: |
      #     marina clean --all -y
