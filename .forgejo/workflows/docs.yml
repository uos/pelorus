# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
# Docs Workflow for Pelorus. The schema is used until there is one for Forgejo.
# The site is redeployed for tagged releases and for pushes to main that touch docs/ or this workflow.
# ci.yml builds the docs as a check on every push that changes more than docs/.

name: Docs

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - "docs/**"
      - ".forgejo/workflows/docs.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Build the documentation
        run: |
          set -euo pipefail
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo run -p pelorus_docs
          cd docs && uvx zensical build --clean
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/pelorus/
          token: ${{ forge.token }}
          source: docs/site/
