          updatetoml=pelorus/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus --features cuda,rerun,evaluate

          # prepare upload
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}-cuda${{ matrix.cuda }}
          path: dist/

  clean-2-5:
    needs:
      - rawlibs-cuda-12-6
    strategy:
      matrix:
        include:
          - runner: bookworm
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  rawlibs-cuda-12-8:
    needs:
      - clean-2-5
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            arch: amd64
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            arch: arm64
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-8
            arch: amd64
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-8
            arch: arm64
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
