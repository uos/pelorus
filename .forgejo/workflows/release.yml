# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
# Release Workflow for Pelorus. The schema is just used until there is one for forgejo.

name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  RUST_FONTCONFIG_DLOPEN: 1
  CARGO_BUILD_JOBS: 2

jobs:
  sanity:
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo check
      - name: Validate packaging files versions
        run: |
          set -euo pipefail
          ulimit -n 65536
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          echo "Workspace version: $VERSION"
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr -DPELORUS_BUILD_SHARED=OFF -DPELORUS_BUILD_STATIC=OFF

          if ! grep -q "Version: $VERSION" pelorus_c/build/pelorus.pc; then
            echo "pelorus.pc version mismatch or missing" >&2
            echo "pelorus.pc content:" >&2
            sed -n '1,120p' pelorus_c/build/pelorus.pc >&2 || true
            exit 1
          fi

          if ! grep -q "pelorus_PACKAGE_VERSION \"${VERSION}\"" pelorus_c/build/pelorusConfig.cmake; then
            echo "pelorusConfig.cmake version mismatch or missing" >&2
            echo "pelorusConfig.cmake content:" >&2
            sed -n '1,120p' pelorus_c/build/pelorusConfig.cmake >&2 || true
            exit 1
          fi

          echo "Packaging files contain correct version: $VERSION"
      - name: Validate minot and packaging dependencies
        run: |
          python3 ./scripts/check-packaging.py

  examples-regression:
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Run C API examples regression
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          ./scripts/api-regression-tests.bash

  rawlibs:
    needs:
      - sanity
      - examples-regression
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:resolute
            arch: amd64
            repo: resolute
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:resolute
            arch: arm64
            repo: resolute
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:noble
            arch: amd64
            repo: noble
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble
            arch: arm64
            repo: noble
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy
            arch: amd64
            repo: jammy
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy
            repo: jammy
            arch: arm64
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          mkdir -p "dist/${ARCH}"

          # ------- RAW
          cargo build -p pelorus_c --release
          mv target/release/libpelorus.so dist/${ARCH}/
          mv target/release/libpelorus.a  dist/${ARCH}/

          cargo build -p pelorus_cli --features rerun --release
          mv target/release/pelorus dist/${ARCH}/

          # ------- DEB
          # -- lib
          updatetoml=pelorus_c/Cargo.toml
          DEB_NAME="libpelorus"
          LIB_DEB=$DEB_NAME
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_c

          # -- dev
          DEB_NAME="libpelorus-dev"
          DEV_DEB=$DEB_NAME
          updatetoml=pelorus_c/deb-dev/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - pin dependencies
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # Generate packaging artifacts with CMake and copy them into the dev crate
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr -DPELORUS_BUILD_SHARED=OFF -DPELORUS_BUILD_STATIC=OFF
          cp pelorus_c/build/pelorus.pc pelorus_c/deb-dev/pelorus.pc
          cp pelorus_c/build/pelorusConfig.cmake pelorus_c/deb-dev/pelorusConfig.cmake
          cp pelorus_c/build/pelorusConfigVersion.cmake pelorus_c/deb-dev/pelorusConfigVersion.cmake

          cargo deb --package libpelorus-dev

          # -- bin
          DEB_NAME="pelorus"
          updatetoml=pelorus_cli/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_cli --features rerun

          # prepare upload
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}
          path: dist/

  macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
    runs-on: macos-latest
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add $TARGET
          ulimit -n 65536
          mkdir -p "dist/${ARCH}"

          cargo build --target $TARGET --release --package pelorus_c --features metal
          mv target/$TARGET/release/libpelorus.dylib dist/${ARCH}/

          cargo build --target $TARGET --release --package pelorus_cli --features metal
          mv target/$TARGET/release/pelorus dist/${ARCH}/

          # Generate cmake config and pkg-config files
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr -DPELORUS_BUILD_SHARED=OFF -DPELORUS_BUILD_STATIC=OFF
          cp pelorus_c/pelorus.h dist/${ARCH}/
          cp pelorus_c/pelorus.hpp dist/${ARCH}/
          cp pelorus_c/build/pelorus.pc dist/${ARCH}/
          cp pelorus_c/build/pelorusConfig.cmake dist/${ARCH}/
          cp pelorus_c/build/pelorusConfigVersion.cmake dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-macos
          path: dist/

  rawlibs-cuda:
    needs:
      - rawlibs
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            arch: amd64
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            arch: arm64
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-6
            arch: amd64
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-6
            arch: arm64
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            arch: amd64
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            arch: arm64
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-8
            arch: amd64
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-8
            arch: arm64
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            arch: amd64
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            arch: arm64
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu13-1
            arch: amd64
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu13-1
            arch: arm64
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          mkdir -p "dist/${ARCH}"

          # Parse cuda tag
          IMAGE_TAG="${IMAGE##*:}"
          CUDA_PART="${IMAGE_TAG#*-cu}"

          # ------- RAW
          cargo build -p pelorus_c --release --features cuda
          mv target/release/libpelorus.so dist/${ARCH}/
          mv target/release/libpelorus.a  dist/${ARCH}/

          cargo build -p pelorus_cli --release --features cuda,rerun
          mv target/release/pelorus dist/${ARCH}/

          # ------- DEB
          # -- lib
          updatetoml=pelorus_c/Cargo.toml
          DEB_NAME="libpelorus-cuda${CUDA_PART}"
          LIB_DEB=$DEB_NAME
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_c

          # -- dev
          DEB_NAME="libpelorus-cuda${CUDA_PART}-dev"
          DEV_DEB=$DEB_NAME
          updatetoml=pelorus_c/deb-dev/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - pin dependencies
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # Generate packaging artifacts with CMake and copy them into the dev crate
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr
          cp pelorus_c/build/pelorus.pc pelorus_c/deb-dev/pelorus.pc
          cp pelorus_c/build/pelorusConfig.cmake pelorus_c/deb-dev/pelorusConfig.cmake
          cp pelorus_c/build/pelorusConfigVersion.cmake pelorus_c/deb-dev/pelorusConfigVersion.cmake

          cargo deb --package libpelorus-dev

          # -- bin
          DEB_NAME="pelorus-cuda${CUDA_PART}"
          updatetoml=pelorus_cli/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_cli --features cuda,rerun

          # prepare upload
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}-cuda${{ matrix.cuda }}
          path: dist/

  clean-3:
    needs:
      - rawlibs-cuda
    strategy:
      matrix:
        include:
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  ros-debs:
    needs:
      - clean-3
    strategy:
      matrix:
        include:
          # Lyrical is on hold: humble and jazzy are the supported targets for
          # now. Re-enabling it needs r2r > 0.9.5, which is not on crates.io yet
          # (tag 0.9.6 of sequenceplanner/r2r has the support).
          # - image: docker.io/stelzo/ubuntu-dev:lyrical
          #   repo: resolute
          #   runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            repo: noble
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:humble
            repo: jammy
            runner: ubuntu-latest
          # - image: docker.io/stelzo/ubuntu-dev:lyrical
          #   repo: resolute
          #   runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            repo: noble
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble
            repo: jammy
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ulimit -n 65536
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          for distro in lyrical jazzy humble; do
          if [ -f "/opt/ros/$distro/setup.bash" ]; then
            echo "Sourcing ROS distro: $distro"
            . "/opt/ros/$distro/setup.bash"
            export ROS_DISTRO="$distro"
            break
          fi
          done

          if [ -z "${ROS_DISTRO:-}" ]; then
            echo "No supported ROS distro found" >&2
            exit 1
          fi

          bash ./scripts/make-deb.bash

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-ros-debs-${{ matrix.repo }}
          path: |
            *.deb

  cli-musl:
    needs:
      - sanity
      - examples-regression
    strategy:
      matrix:
        include:
          # Built natively per arch instead of cross-compiled with cargo-zigbuild:
          # rustc passes -Wl,--fix-cortex-a53-843419 for aarch64 targets and zig's
          # linker rejects it ("unsupported linker arg").
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-dev-resolute
            arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-dev-resolute-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          ulimit -n 65536
          apt-get update && apt-get install -y musl-tools
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add $TARGET

          mkdir -p "dist/${ARCH}"

          # for ring
          export CFLAGS_aarch64_unknown_linux_musl="-D__ARM_ARCH=8"
          export RUSTFLAGS="-C target-feature=+crt-static"
          cargo build -p pelorus_cli --release --target $TARGET
          mv target/$TARGET/release/pelorus dist/${ARCH}/

          cargo build -p pelorus_cli --release --target $TARGET --no-default-features --features ros2-client,processing-time-export,rayon
          mv target/$TARGET/release/pelorus dist/${ARCH}/pelorus-dds

          cargo build -p pelorus_cli --release --target $TARGET --no-default-features --features offline-hiroz,processing-time-export,rayon
          mv target/$TARGET/release/pelorus dist/${ARCH}/pelorus-hiroz

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-cli-musl
          path: dist/

  ros-debs-cuda:
    needs:
      - ros-debs
    strategy:
      matrix:
        include:
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu12-6
          #   repo: resolute
          #   cuda: 12-6
          #   runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu12-6
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:humble-cu12-6
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu12-6
          #   repo: resolute
          #   cuda: 12-6
          #   runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu12-6
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble-cu12-6
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest-arm
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu12-8
          #   repo: resolute
          #   cuda: 12-8
          #   runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu12-8
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:humble-cu12-8
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu12-8
          #   repo: resolute
          #   cuda: 12-8
          #   runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu12-8
            repo: noble
            cuda: 12-8
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble-cu12-8
            repo: jammy
            cuda: 12-8
            runner: ubuntu-latest-arm
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu13-1
          #   repo: resolute
          #   cuda: 13-1
          #   runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu13-1
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:humble-cu13-1
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest
          # - image: docker.io/stelzo/ubuntu-dev:lyrical-cu13-1
          #   repo: resolute
          #   cuda: 13-1
          #   runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu13-1
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble-cu13-1
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ulimit -n 65536
          for distro in lyrical jazzy humble; do
          if [ -f "/opt/ros/$distro/setup.bash" ]; then
            echo "Sourcing ROS distro: $distro"
            . "/opt/ros/$distro/setup.bash"
            break
          fi
          done

          if [ -z "${ROS_DISTRO:-}" ]; then
            echo "No supported ROS distro found" >&2
            exit 1
          fi

          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          # mark ROS package with CUDA suffix so the generated .deb is variant-specific
          export CUDA_PART="${{ matrix.cuda }}"
          sed -i "s|<name>pelorus</name>|<name>pelorus-cuda${CUDA_PART}</name>|" package.xml
          sed -i "s|project(pelorus)|project(pelorus-cuda${CUDA_PART})|" CMakeLists.txt
          sed -i "s/^\[features\]/[[bin]]\nname = \"pelorus-cuda${CUDA_PART}\"\npath = \"src\/main.rs\"\n\n[features]/" pelorus_cli/Cargo.toml

          export PELORUS_CUDA=1
          bash ./scripts/make-deb.bash

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-ros-debs-${{ matrix.repo }}-${{ matrix.cuda }}
          path: |
            *.deb

  clean-4:
    needs:
      - ros-debs-cuda
    strategy:
      matrix:
        include:
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  glim:
    needs:
      - clean-4
      - rawlibs
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:glim-noble
            repo: noble
            arch: amd64
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:glim-noble
            repo: noble
            arch: arm64
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:glim-jammy
            repo: jammy
            arch: amd64
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:glim-jammy
            repo: jammy
            arch: arm64
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Download libpelorus
        uses: actions/download-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}
          path: deb-artifacts
      - name: Install libpelorus
        run: |
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          dpkg -i "./deb-artifacts/$ARCH/libpelorus_${VERSION}_${ARCH}.deb"
          dpkg -i "./deb-artifacts/$ARCH/libpelorus-dev_${VERSION}_${ARCH}.deb"
      - name: Build
        run: |
          ulimit -n 65536
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          mkdir -p dist/${ARCH}
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          # - set name
          updatetoml=glim_integration/pelorus_glim_odometry/Cargo.toml
          DEB_NAME="libpelorus_glim_odometry"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          WD=$(pwd)
          BUILD_DIR="$WD/glim_integration/pelorus_glim_odometry/build"
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          cmake ..
          make -j2
          cd $WD
          cp "$BUILD_DIR/libodometry_estimation_pelorus.so" dist/${ARCH}/

          # ---- CPU
          DEB_NAME="libpelorus_glim_odometry"
          LIB_DEB="libpelorus"

          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"
          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

          # ---- CUDA 12.6
          DEB_NAME="libpelorus_glim_odometry-cuda12-6"
          LIB_DEB="libpelorus-cuda12-6"

          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

          # ---- CUDA 13.1
          DEB_NAME="libpelorus_glim_odometry-cuda13-1"
          LIB_DEB="libpelorus-cuda13-1"

          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-glim-${{ matrix.repo }}
          path: |
            dist/*

  wheels:
    needs:
      - sanity
      - examples-regression
    strategy:
      matrix:
        # omitting ppc64le and s390x since they probably have other problems than running this software
        # The aarch64 Linux targets are built natively on an arm64 runner
        # instead of cross-compiled with zig. Their rustc target specs attach
        # `-Wl,--fix-cortex-a53-843419` as a pre_link_arg for every cc-driver
        # linker flavor, and zig's linker rejects it ("unsupported linker arg").
        # There is no way to switch it off: rustc registers the arg for the lld
        # flavor as well, so -C linker-flavor / -fuse-ld=lld do not drop it, and
        # cargo-zigbuild does not filter it out in any released version. Every
        # other target keeps --zig, which is what gives the x86_64 wheels their
        # low glibc requirement. aarch64-unknown-linux-gnu additionally needs a
        # controlled glibc floor, so it lives in `wheels-aarch64-gnu` below.
        include:
          - target: aarch64-apple-darwin # MacOS Apple Silicon
            runner: macos-latest
            zig: "no"
          - target: x86_64-unknown-linux-gnu # x64 gnu
            runner: ubuntu-dev-resolute
            zig: "yes"
          - target: x86_64-unknown-linux-musl # musl manylinux x64
            runner: ubuntu-dev-resolute
            zig: "yes"
          - target: aarch64-unknown-linux-musl # musl manylinux armv8
            runner: ubuntu-dev-resolute-arm
            zig: "no"
          - target: armv7-unknown-linux-musleabihf # musl manylinux armv7
            runner: ubuntu-dev-resolute
            zig: "yes"
          - target: armv7-unknown-linux-gnueabihf # glibc armv7
            runner: ubuntu-dev-resolute
            zig: "yes"
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      USE_ZIG: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        run: |
          set -euo pipefail
          ulimit -n 65536
          if [[ "$TARGET" != *apple-darwin* ]]; then
            apt-get update -y
            apt-get install -y musl-tools patchelf
          fi
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add "$TARGET"

          # for ring
          export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"
          export CFLAGS_aarch64_unknown_linux_musl="-D__ARM_ARCH=8"

          if [[ "$TARGET" == *apple-darwin* ]]; then
            maturin build --manifest-path pelorus_cli/Cargo.toml --release --target-dir wheels --features rerun,metal
            maturin build --manifest-path pelorus_py/Cargo.toml --release --target-dir wheels --features metal
          else
            ZIG=""
            if [ "$USE_ZIG" = "yes" ]; then
              ZIG="--zig"
            fi

            # A natively built musl target needs its tag forced. maturin only
            # infers musllinux when zig tells it the target libc; building
            # natively it just auditwheels the artifact, and a statically
            # linked musl binary has no dynamic deps at all, so pelorus_cli
            # came out tagged manylinux_2_17 - which no musl system will ever
            # install.
            COMPAT=""
            if [ "$USE_ZIG" = "no" ] && [[ "$TARGET" == *-musl* ]]; then
              COMPAT="--compatibility musllinux_1_2"
            fi

            maturin build $ZIG $COMPAT --manifest-path pelorus_cli/Cargo.toml --release --target-dir wheels --features rerun --target "$TARGET"
            maturin build $ZIG $COMPAT --manifest-path pelorus_py/Cargo.toml --release --target-dir wheels --target "$TARGET"
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  wheels-aarch64-gnu:
    # Split out of `wheels` because this target needs both a native arm64 build
    # (zig cannot link aarch64, see the note there) and a pinned glibc floor.
    # Built natively on the resolute arm runner the wheel came out tagged
    # `linux_aarch64`: that runner's glibc is newer than any manylinux policy
    # maturin knows, so it gave up on a manylinux tag, and PyPI rejects
    # `linux_*` outright. Jammy pins glibc 2.35 -> manylinux_2_35_aarch64, which
    # still covers Ubuntu 22.04+ / Debian 12+ / JetPack 6. The
    # arm-runner-plus-container shape is the same one `wheels-cuda` uses to
    # build this target with maturin.
    needs:
      - sanity
      - examples-regression
    runs-on: ubuntu-latest-arm
    container:
      image: docker.io/stelzo/ubuntu-dev:jammy
    env:
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        run: |
          set -euo pipefail
          ulimit -n 65536
          # maturin shells out to patchelf when it bundles libgcc_s into the
          # pelorus_py wheel
          apt-get update -y
          apt-get install -y patchelf
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add "$TARGET"

          # for ring
          export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"

          maturin build --manifest-path pelorus_cli/Cargo.toml --release --target-dir wheels --features rerun --target "$TARGET"
          maturin build --manifest-path pelorus_py/Cargo.toml --release --target-dir wheels --target "$TARGET"

      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels

  wheels-cuda:
    needs:
      - sanity
      - examples-regression
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cuda: 12-6
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest-arm
            cuda: 12-6
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cuda: 12-8
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-8
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest-arm
            cuda: 12-8
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cuda: 13-1
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest-arm
            cuda: 13-1
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build CUDA wheels
        run: |
          ulimit -n 65536
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          maturin build --manifest-path pelorus_cli/Cargo.toml --release --features cuda,rerun --target "$TARGET" --skip-auditwheel
          maturin build --manifest-path pelorus_py/Cargo.toml --release --features cuda --target "$TARGET" --skip-auditwheel
      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels-cuda${{ matrix.cuda }}
          path: target/wheels

  clean-7:
    needs:
      - wheels-cuda
    strategy:
      matrix:
        include:
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: docker system prune -af

  tarball:
    needs:
      - cli-musl
      - macos
      - ros-debs
      - ros-debs-cuda
      - glim
      - rawlibs
      - rawlibs-cuda
      - wheels
      - wheels-aarch64-gnu
      - wheels-cuda
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dl

      - name: Create tarballs
        run: |
          set -euo pipefail
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          mkdir -p release

          make_tarball() {
            local archive_name=$1; shift
            local staging
            staging=$(mktemp -d)
            local dest="$staging/pelorus-${VERSION}"
            mkdir -p "$dest"
            for f in "$@"; do
              [ -f "$f" ] && cp "$f" "$dest/"
            done
            # only create if we actually copied files
            if [ "$(ls -A "$dest" 2>/dev/null)" ]; then
              tar -czf "release/${archive_name}.tar.gz" -C "$staging" "pelorus-${VERSION}"
              echo "  created ${archive_name}.tar.gz"
            else
              echo "  SKIP ${archive_name} (no files found)"
            fi
            rm -rf "$staging"
          }

          echo "=== Linux glibc ==="
          for repo in resolute noble jammy; do
            for arch in amd64 arm64; do
              make_tarball "pelorus-${VERSION}-linux-${repo}-${arch}" \
                "dl/artifacts-rawlibs-${repo}/${arch}/pelorus" \
                "dl/artifacts-rawlibs-${repo}/${arch}/libpelorus.so" \
                "dl/artifacts-rawlibs-${repo}/${arch}/libpelorus.a"
            done
          done

          echo "=== Linux musl (static) ==="
          for arch in amd64 arm64; do
            make_tarball "pelorus-${VERSION}-linux-musl-${arch}" \
              "dl/artifacts-cli-musl/${arch}/pelorus"
            make_tarball "pelorus-${VERSION}-linux-musl-dds-${arch}" \
              "dl/artifacts-cli-musl/${arch}/pelorus-dds"
            make_tarball "pelorus-${VERSION}-linux-musl-hiroz-${arch}" \
              "dl/artifacts-cli-musl/${arch}/pelorus-hiroz"
          done

          echo "=== macOS ==="
          for arch in arm64; do
            make_tarball "pelorus-${VERSION}-macos-${arch}" \
              "dl/artifacts-macos/${arch}/pelorus" \
              "dl/artifacts-macos/${arch}/libpelorus.dylib" \
              "dl/artifacts-macos/${arch}/pelorus.h" \
              "dl/artifacts-macos/${arch}/pelorus.hpp" \
              "dl/artifacts-macos/${arch}/pelorus.pc" \
              "dl/artifacts-macos/${arch}/pelorusConfig.cmake" \
              "dl/artifacts-macos/${arch}/pelorusConfigVersion.cmake"
          done

          echo "=== Linux CUDA ==="
          for cuda in 12-6 12-8 13-1; do
            for repo in noble jammy; do
              for arch in amd64 arm64; do
                make_tarball "pelorus-${VERSION}-linux-${repo}-${arch}-cuda${cuda}" \
                  "dl/artifacts-rawlibs-${repo}-cuda${cuda}/${arch}/pelorus" \
                  "dl/artifacts-rawlibs-${repo}-cuda${cuda}/${arch}/libpelorus.so" \
                  "dl/artifacts-rawlibs-${repo}-cuda${cuda}/${arch}/libpelorus.a"
              done
            done
          done

          echo "=== glim plugin ==="
          for repo in noble jammy; do
            for arch in amd64 arm64; do
              make_tarball "pelorus-glim-${VERSION}-linux-${repo}-${arch}" \
                "dl/artifacts-glim-${repo}/${arch}/libodometry_estimation_pelorus.so"
            done
          done

          echo ""
          echo "=== Release artifacts ==="
          ls -lh release/

      - name: Upload tarballs
        uses: actions/upload-artifact@v3
        with:
          name: release-tarballs
          path: release/

  release:
    needs:
      - tarball
    runs-on: ubuntu-dev-resolute
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download tarballs
        uses: actions/download-artifact@v3
        with:
          name: release-tarballs
          path: release

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${FORGEJO_REF_NAME}"
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)

          tea login add --name codeberg --url "${FORGEJO_SERVER_URL}" --token "${GITHUB_TOKEN}"
          tea release delete --repo "${FORGEJO_REPOSITORY}" --confirm "${FORGEJO_REF_NAME}" || true

          # Build --asset flags for every tarball
          ASSET_FLAGS=""
          for f in release/*.tar.gz; do
            [ -f "$f" ] || continue
            ASSET_FLAGS="${ASSET_FLAGS} --asset ${f}"
          done

          echo "=== Uploading $(ls release/*.tar.gz 2>/dev/null | wc -l) assets ==="

          # Create release with all assets in one call
          # tea will fail if the release already exists, so handle that
          if ! tea release create \
            --login codeberg \
            --repo "${FORGEJO_REPOSITORY}" \
            --tag "${TAG}" \
            --title "${TAG}" \
            --note "Release ${TAG}

          ### Install
          See the documentation for installation instructions.

          ### Artifacts
          - **tar.gz** archives for Linux (resolute, noble, jammy, musl, musl-dds, musl-hiroz) and macOS (amd64, arm64)
          - **CUDA** variants
          - **.deb** packages published to [PPA](https://codeberg.org/uos-robotics/ppa)
          - **Python wheels** on PyPI and custom index for CUDA variants" \
            ${ASSET_FLAGS}; then

            echo "Release may already exist, trying to add assets individually..."
            for f in release/*.tar.gz; do
              [ -f "$f" ] || continue
              echo "  uploading $(basename "$f")..."
              tea release create \
                --login codeberg \
                --repo "${FORGEJO_REPOSITORY}" \
                --tag "${TAG}" \
                --title "${TAG}" \
                --asset "$f" 2>/dev/null || true
            done
          fi

          echo "Release ${TAG} published."

  publish-ppa:
    needs:
      - release
    runs-on: ubuntu-dev-resolute
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: dl

      - name: Publish to PPA
        env:
          PPA_DEPLOY_KEY: ${{ secrets.PPA_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          ./scripts/update_mirror.bash
          apt-get install -y ssh

          # ── Collect .deb files by series ──────────────────────
          mkdir -p staging/resolute staging/noble staging/jammy

          # rawlibs
          for repo in resolute noble jammy; do
            find "dl/artifacts-rawlibs-${repo}" -name '*.deb' -exec cp {} "staging/${repo}/" \; 2>/dev/null || true
          done

          # rawlibs-cuda
          for cuda in 12-6 12-8 13-1; do
            for repo in noble jammy; do
              find "dl/artifacts-rawlibs-${repo}-cuda${cuda}" -name '*.deb' -exec cp {} "staging/${repo}/" \; 2>/dev/null || true
            done
          done

          # ros-debs
          for repo in noble jammy; do
            find "dl/artifacts-ros-debs-${repo}" -name '*.deb' -exec cp {} "staging/${repo}/" \; 2>/dev/null || true
          done

          # ros-debs-cuda
          for cuda in 12-6 12-8 13-1; do
            for repo in noble jammy; do
              find "dl/artifacts-ros-debs-${repo}-${cuda}" -name '*.deb' -exec cp {} "staging/${repo}/" \; 2>/dev/null || true
            done
          done

          # glim
          for repo in noble jammy; do
            find "dl/artifacts-glim-${repo}" -name '*.deb' -exec cp {} "staging/${repo}/" \; 2>/dev/null || true
          done

          echo "=== Collected .deb files ==="
          echo "noble: $(ls staging/noble/*.deb 2>/dev/null | wc -l) packages"
          echo "resolute: $(ls staging/resolute/*.deb 2>/dev/null | wc -l) packages"
          echo "jammy:  $(ls staging/jammy/*.deb 2>/dev/null | wc -l) packages"

          # ── Collect wheels by variant ─────────────────────────
          mkdir -p staging-whl/cpu staging-whl/cu126 staging-whl/cu128 staging-whl/cu131

          # CPU wheels
          find "dl/wheels" -name '*.whl' -exec cp {} staging-whl/cpu/ \; 2>/dev/null || true

          # CUDA wheels
          find "dl/wheels-cuda12-6" -name '*.whl' -exec cp {} staging-whl/cu126/ \; 2>/dev/null || true
          find "dl/wheels-cuda12-8" -name '*.whl' -exec cp {} staging-whl/cu128/ \; 2>/dev/null || true
          find "dl/wheels-cuda13-1" -name '*.whl' -exec cp {} staging-whl/cu131/ \; 2>/dev/null || true

          echo ""
          echo "=== Collected wheels ==="
          for v in cpu cu126 cu128 cu131; do
            echo "${v}: $(ls staging-whl/${v}/*.whl 2>/dev/null | wc -l) wheels"
          done

          # ── Helper: build PEP 503 simple index ────────────────
          build_pep503_index() {
            local base_dir=$1  # e.g. whl/cpu

            # Organise wheels into per-package subdirectories
            for whl in "$base_dir"/*.whl; do
              [ -f "$whl" ] || continue
              # normalised package name: lowercase, [-_.] → -
              local pkg
              pkg=$(basename "$whl" | sed 's/-[0-9].*//' | tr '[:upper:]_.' '[:lower:]--' | sed 's/--*/-/g')
              mkdir -p "$base_dir/$pkg"
              mv "$whl" "$base_dir/$pkg/"
            done

            # Per-package index.html
            for pkg_dir in "$base_dir"/*/; do
              [ -d "$pkg_dir" ] || continue
              {
                echo '<!DOCTYPE html><html><body>'
                for whl in "$pkg_dir"/*.whl; do
                  [ -f "$whl" ] || continue
                  local fname hash
                  fname=$(basename "$whl")
                  hash=$(sha256sum "$whl" | awk '{print $1}')
                  echo "<a href=\"${fname}#sha256=${hash}\">${fname}</a><br/>"
                done
                echo '</body></html>'
              } > "$pkg_dir/index.html"
            done

            # Root index.html (lists packages)
            {
              echo '<!DOCTYPE html><html><body>'
              for pkg_dir in "$base_dir"/*/; do
                [ -d "$pkg_dir" ] || continue
                local pkg_name
                pkg_name=$(basename "$pkg_dir")
                echo "<a href=\"${pkg_name}/\">${pkg_name}</a><br/>"
              done
              echo '</body></html>'
            } > "$base_dir/index.html"
          }

          mkdir -p ~/.ssh
          printf '%s\n' "$PPA_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes'

          git clone --depth 1 --filter=blob:none --sparse ssh://git@codeberg.org/uos-robotics/ppa.git ppa
          cd ppa
          git sparse-checkout init --cone
          git sparse-checkout set \
            ubuntu/pool/main/noble \
            ubuntu/pool/main/resolute \
            ubuntu/pool/main/jammy \
            whl/cpu \
            whl/cu126 \
            whl/cu128 \
            whl/cu131 \
            bin

          for series in resolute noble jammy; do
            mkdir -p "ubuntu/pool/main/${series}"
            cp ../staging/${series}/*.deb "ubuntu/pool/main/${series}/" 2>/dev/null || true
          done

          for variant in cpu cu126 cu128 cu131; do
            mkdir -p "whl/${variant}"
            cp ../staging-whl/${variant}/*.whl "whl/${variant}/" 2>/dev/null || true
            build_pep503_index "whl/${variant}"
          done

          # Copy macOS and musl tarballs
          mkdir -p bin
          find "../dl/release-tarballs" -name 'pelorus-*-macos-*.tar.gz' -exec cp {} bin/ \; 2>/dev/null || true
          find "../dl/release-tarballs" -name 'pelorus-*-linux-musl-*.tar.gz' -exec cp {} bin/ \; 2>/dev/null || true

          # Commit and push
          git add ubuntu/ whl/ bin/
          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global user.name "$(git log -1 --pretty=format:'%an')"
          git commit -m "ci: add debs and wheels from ${FORGEJO_REPOSITORY}@${FORGEJO_SHA}" || echo "No changes to commit"
          git push origin pages

          # Cleanup
          shred -u ~/.ssh/deploy_key || rm -f ~/.ssh/deploy_key
          cd ..

          echo ""
          echo "=== PPA published ==="
          echo "Debs:   https://codeberg.org/uos-robotics/ppa/src/branch/main/ubuntu/pool/main/"
          echo "Wheels: pip install pelorus --extra-index-url https://codeberg.org/uos-robotics/ppa/raw/branch/main/whl/cpu/"
          echo "CUDA:   pip install pelorus --extra-index-url https://codeberg.org/uos-robotics/ppa/raw/branch/main/whl/cu126/"

  aur:
    runs-on: ubuntu-dev-resolute
    needs:
      - release
      - publish-ppa
    container:
      image: archlinux:latest
    steps:
      - name: Deps
        run: |
          pacman -Sy --noconfirm openssh git nodejs sudo base-devel

          useradd -m build
          echo "build ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/build

      - uses: actions/checkout@v4

      - name: Update AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p /home/build/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /home/build/.ssh/aur_key
          chmod 600 /home/build/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> /home/build/.ssh/known_hosts

          chown -R build:build . /home/build/.ssh

          sudo -u build env \
            GIT_SSH_COMMAND='ssh -i /home/build/.ssh/aur_key -o UserKnownHostsFile=/home/build/.ssh/known_hosts -o StrictHostKeyChecking=yes' \
            FORGEJO_REPOSITORY="$FORGEJO_REPOSITORY" \
            FORGEJO_SHA="$FORGEJO_SHA" \
            bash << 'EOF'
            set -euo pipefail

            # Set git identity
            git config --global user.email "$(git log -1 --pretty=format:'%ae')"
            git config --global user.name "$(git log -1 --pretty=format:'%an')"

            # Clone and update
            git clone ssh://aur@aur.archlinux.org/pelorus-bin.git pelorus-bin
            cp packaging/arch-bin/PKGBUILD pelorus-bin/
            cd pelorus-bin
            
            # This will now succeed without the root error
            makepkg --printsrcinfo > .SRCINFO
            
            git add -f .SRCINFO PKGBUILD

            # A re-run on an unchanged PKGBUILD stages nothing, and `git commit`
            # exits 1 on an empty commit, which `set -e` turns into a job failure.
            # The AUR is already at the right version in that case, so it is a no-op.
            if git diff --cached --quiet; then
              echo "AUR pelorus-bin already up to date; nothing to publish."
            else
              git commit -m "Update package from $FORGEJO_REPOSITORY@$FORGEJO_SHA"
              git push origin
            fi
          EOF
          shred -u /home/build/.ssh/aur_key

  homebrew:
    runs-on: ubuntu-dev-resolute
    needs:
      - publish-ppa
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release tarballs
        uses: actions/download-artifact@v3
        with:
          name: release-tarballs
          path: release

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)

          ./scripts/update_mirror.bash
          apt-get install -y keychain

          ARM_SHA256=$(sha256sum "release/pelorus-${VERSION}-macos-arm64.tar.gz" | awk '{print $1}')

          sed \
            -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
            -e "s/ARM_SHA256_PLACEHOLDER/${ARM_SHA256}/g" \
            packaging/homebrew/pelorus.rb > /tmp/pelorus.rb

          mkdir -p ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/tap_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes'

          git config --global user.email "$(git log -1 --pretty=format:'%ae')"
          git config --global user.name "$(git log -1 --pretty=format:'%an')"

          git clone git@github.com:uos/homebrew-tools.git homebrew-tools
          mkdir -p homebrew-tools/Formula
          cp /tmp/pelorus.rb homebrew-tools/Formula/pelorus.rb
          cd homebrew-tools
          git add Formula/pelorus.rb
          git commit -m "pelorus ${VERSION}"
          git push origin
          shred -u ~/.ssh/tap_key || rm -f ~/.ssh/tap_key

  publish-pypi:
    needs:
      - release
    runs-on: ubuntu-dev-resolute
    steps:
      - name: Download CPU wheels
        uses: actions/download-artifact@v3
        with:
          name: wheels
          path: dist
      - name: Get twine
        run: uv tool install twine
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Wheels to publish ==="
          ls -lh dist/*.whl 2>/dev/null || true

          twine upload \
            --username __token__ \
            --password "${PYPI_TOKEN}" \
            --non-interactive \
            --skip-existing \
            --verbose \
            dist/*.whl

          echo "Published to PyPI."

