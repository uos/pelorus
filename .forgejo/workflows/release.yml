            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy-cu12-6
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble-cu12-6
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest-arm
