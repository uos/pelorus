          docker system prune -af

  ros-debs:
    needs:
      - clean-3
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            repo: noble
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:humble
            repo: jammy
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            repo: noble
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble
            repo: jammy
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup update

          for distro in jazzy humble; do
          if [ -f "/opt/ros/$distro/setup.bash" ]; then
            echo "Sourcing ROS distro: $distro"
            . "/opt/ros/$distro/setup.bash"
            export ROS_DISTRO="$distro"
            break
          fi
          done

          if [ -z "${ROS_DISTRO:-}" ]; then
            echo "No supported ROS distro found" >&2
            exit 1
          fi

          bash ./scripts/make-deb.bash

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-ros-debs-${{ matrix.repo }}
          path: |
            *.deb

  cli-musl:
    needs:
      - ros-debs
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-dev-noble-arm
            arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-dev-noble-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
