            cuda: 13-1
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:humble-cu13-1
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          for distro in jazzy humble; do
          if [ -f "/opt/ros/$distro/setup.bash" ]; then
            echo "Sourcing ROS distro: $distro"
            . "/opt/ros/$distro/setup.bash"
            break
          fi
          done

          if [ -z "${ROS_DISTRO:-}" ]; then
            echo "No supported ROS distro found" >&2
            exit 1
          fi

          rustup update

          export PELORUS_CUDA=1
          bash ./scripts/make-deb.bash

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-ros-debs-${{ matrix.repo }}-${{ matrix.cuda }}
          path: |
            *.deb

  clean-5:
    needs:
      - ros-debs-cuda-13-1
    strategy:
      matrix:
        include:
          - runner: bookworm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  glim:
    needs:
      - clean-5
      - rawlibs
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:glim-noble
            repo: noble
            arch: amd64
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:glim-noble
            repo: noble
            arch: arm64
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:glim-jammy
            repo: jammy
            arch: amd64
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:glim-jammy
            repo: jammy
            arch: arm64
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Download libpelorus
        uses: actions/download-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}
          path: deb-artifacts
      - name: Install libpelorus
        run: |
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          dpkg -i "./deb-artifacts/$ARCH/libpelorus_${VERSION}_${ARCH}.deb"
          dpkg -i "./deb-artifacts/$ARCH/libpelorus-dev_${VERSION}_${ARCH}.deb"
      - name: Build
        run: |
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          mkdir -p dist/${ARCH}
          rustup update

          # - set name
          updatetoml=glim_integration/pelorus_glim_odometry/Cargo.toml
          DEB_NAME="libpelorus_glim_odometry"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          WD=$(pwd)
          BUILD_DIR="$WD/glim_integration/pelorus_glim_odometry/build"
          mkdir -p $BUILD_DIR

          # ---- CPU
          # - pin dependencies
          LIB_DEB="libpelorus"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - build
          cd $BUILD_DIR
          cmake ..
          make -j2
          cd $WD
          cp "$BUILD_DIR/libodometry_estimation_pelorus.so" dist/${ARCH}/
          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

          # ---- CUDA 12.6
          # - pin dependencies
          LIB_DEB="libpelorus-cuda12-6"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - build
          cd $BUILD_DIR
          cmake ..
          make -j2
          cd $WD
          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

          # ---- CUDA 13.1
          # - pin dependencies
          LIB_DEB="libpelorus-cuda13-1"
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - build
          cd $BUILD_DIR
          cmake ..
          make -j2
          cd $WD
          cargo deb --package pelorus_glim_odometry --no-build
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload deb
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-glim-${{ matrix.repo }}
          path: |
            dist/*

  clean-6:
    needs:
      - glim
    strategy:
      matrix:
        include:
          - runner: bookworm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  wheels:
    runs-on: ubuntu-dev-noble-arm # the ARM runner has more power and capacity
    needs:
      - clean-6
    strategy:
      matrix:
        # omitting ppc64le and s390x since they probably have other problems than running this software
        include:
          - target: x86_64-apple-darwin # MacOS x64
          - target: aarch64-apple-darwin # MacOS Apple Silicon
          - target: aarch64-unknown-linux-gnu # armv8 gnu (Jetson etc)
          - target: x86_64-unknown-linux-gnu # x64 gnu
          - target: x86_64-unknown-linux-musl # musl manylinux x64
          - target: aarch64-unknown-linux-musl # musl manylinux armv8
          - target: armv7-unknown-linux-musleabihf # musl manylinux armv7
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        run: |
          rustup update
          rustup target add "$TARGET"

          if [[ "$TARGET" == *apple-darwin* ]]; then
            export SDKROOT=/opt/MacOSX.sdk
            export RUSTFLAGS="-C link-arg=-F${SDKROOT}/System/Library/Frameworks -C link-arg=-L${SDKROOT}/usr/lib -C link-arg=-isysroot -C link-arg=${SDKROOT}"
          fi

          # binary
          MATURIN_ARGS="build --zig --manifest-path pelorus/Cargo.toml --release --target-dir wheels"
          maturin $MATURIN_ARGS --target "$TARGET"

          # bindings
          MATURIN_ARGS="build --zig --manifest-path pelorus_py/Cargo.toml --release --target-dir wheels"
          maturin $MATURIN_ARGS --target "$TARGET"

      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: target/wheels
