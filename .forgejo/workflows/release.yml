# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
# Release Workflow for Pelorus. The schema is just used until there is one for forgejo.

name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-dev-noble-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          rustup update
          cargo check
      - name: Validate packaging files versions
        run: |
          set -euo pipefail
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          echo "Workspace version: $VERSION"
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr

          if ! grep -q "Version: $VERSION" pelorus_c/build/pelorus.pc; then
            echo "pelorus.pc version mismatch or missing" >&2
            echo "pelorus.pc content:" >&2
            sed -n '1,120p' pelorus_c/build/pelorus.pc >&2 || true
            exit 1
          fi

          if ! grep -q "pelorus_PACKAGE_VERSION \"${VERSION}\"" pelorus_c/build/pelorusConfig.cmake; then
            echo "pelorusConfig.cmake version mismatch or missing" >&2
            echo "pelorusConfig.cmake content:" >&2
            sed -n '1,120p' pelorus_c/build/pelorusConfig.cmake >&2 || true
            exit 1
          fi

          echo "Packaging files contain correct version: $VERSION"

  clean-1:
    needs:
      - sanity
    strategy:
      matrix:
        include:
          - runner: bookworm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  rawlibs:
    needs:
      - clean-1
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble
            arch: amd64
            repo: noble
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble
            arch: arm64
            repo: noble
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy
            arch: amd64
            repo: jammy
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy
            repo: jammy
            arch: arm64
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          VERSION=$VERSION-1
          rustup update

          mkdir -p "dist/${ARCH}"
           
          # ------- RAW
          cargo build -p pelorus_c --release
          mv target/release/libpelorus.so dist/${ARCH}/
          mv target/release/libpelorus.a  dist/${ARCH}/

          cargo build -p pelorus --release
          mv target/release/pelorus dist/${ARCH}/

          # ------- DEB
          # -- lib
          updatetoml=pelorus_c/Cargo.toml
          DEB_NAME="libpelorus"
          LIB_DEB=$DEB_NAME
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_c

          # -- dev
          DEB_NAME="libpelorus-dev"
          DEV_DEB=$DEB_NAME
          updatetoml=pelorus_c/deb-dev/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          # - pin dependencies
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.depends' "${LIB_DEB} ( = ${VERSION} )" >"$tmp"
          mv "$tmp" "$updatetoml"

          # Generate packaging artifacts with CMake and copy them into the dev crate
          cmake -S pelorus_c -B pelorus_c/build -DCMAKE_INSTALL_PREFIX=/usr
          cp pelorus_c/build/pelorus.pc pelorus_c/deb-dev/pelorus.pc
          cp pelorus_c/build/pelorusConfig.cmake pelorus_c/deb-dev/pelorusConfig.cmake

          cargo deb --package libpelorus-dev

          # -- bin
          DEB_NAME="pelorus"
          updatetoml=pelorus/Cargo.toml
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus

          # prepare upload
          mv target/debian/*.deb dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}
          path: dist/

  clean-2:
    needs:
      - rawlibs
    strategy:
      matrix:
        include:
          - runner: bookworm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  macos:
    needs:
      - clean-2
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    runs-on: ubuntu-dev-noble-arm
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      SDKROOT: /opt/MacOSX.sdk
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          rustup update
          rustup target add $TARGET

          mkdir -p "dist/${ARCH}"

          export RUSTFLAGS="-C link-arg=-F${SDKROOT}/System/Library/Frameworks -C link-arg=-L${SDKROOT}/usr/lib -C link-arg=-isysroot -C link-arg=${SDKROOT}"
          cargo zigbuild --target $TARGET "$@" --release --package pelorus_c
          mv target/$TARGET/release/libpelorus.dylib dist/${ARCH}/
          mv target/$TARGET/release/libpelorus.a  dist/${ARCH}/

          cargo zigbuild --target $TARGET "$@" --release --package pelorus
          mv target/$TARGET/release/pelorus dist/${ARCH}/

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-macos
          path: dist/

  rawlibs-cuda-12-6:
    needs:
      - macos
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            arch: amd64
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu12-6
            arch: arm64
            repo: noble
            cuda: 12-6
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-6
            arch: amd64
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu12-6
            arch: arm64
            repo: jammy
            cuda: 12-6
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          apt-get install -y cmake
          VERSION=$(toml get --raw Cargo.toml workspace.package.version)
          rustup update

          mkdir -p "dist/${ARCH}"

          # Parse cuda tag
          IMAGE_TAG="${IMAGE##*:}"
          CUDA_PART="${IMAGE_TAG#*-cu}"

          # ------- RAW
          cargo build -p pelorus_c --release --features cuda
          mv target/release/libpelorus.so dist/${ARCH}/
          mv target/release/libpelorus.a  dist/${ARCH}/

          cargo build -p pelorus --release --features cuda
          mv target/release/pelorus dist/${ARCH}/

          # ------- DEB
          # -- lib
          updatetoml=pelorus_c/Cargo.toml
          DEB_NAME="libpelorus-cuda${CUDA_PART}"
          LIB_DEB=$DEB_NAME
          tmp=$(mktemp)
          toml set "$updatetoml" 'package.metadata.deb.name' "$DEB_NAME" >"$tmp"
          mv "$tmp" "$updatetoml"

          cargo deb --package pelorus_c

          # -- dev
