      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: artifacts-rawlibs-${{ matrix.repo }}-cuda${{ matrix.cuda }}
          path: dist/

  clean-2-75:
    needs:
      - rawlibs-cuda-12-8
    strategy:
      matrix:
        include:
          - runner: bookworm
          - runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Docker clean
        run: |
          docker system prune -af

  rawlibs-cuda-13-1:
    needs:
      - clean-2-75
    strategy:
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            arch: amd64
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
            arch: arm64
            repo: noble
            cuda: 13-1
            runner: ubuntu-latest-arm
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu13-1
            arch: amd64
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest
          - image: docker.io/stelzo/ubuntu-dev:jammy-cu13-1
            arch: arm64
            repo: jammy
            cuda: 13-1
            runner: ubuntu-latest-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
