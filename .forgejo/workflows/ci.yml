# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: ci

on:
  push:

env:
  RUST_BACKTRACE: "full"
  RUST_FONTCONFIG_DLOPEN: "1"

jobs:
  rust-build-test:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging versions and dependencies
        run: |
          python3 ./scripts/check-packaging.py
      - name: Build and test workspace
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo check
          cargo test

  config-docs:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Generate the documentation
        run: |
          set -euo pipefail
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo run -p pelorus_docs
      - name: Check nothing generated is tracked
        run: |
          set -euo pipefail
          if ! git diff --quiet || [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "Generating the documentation changed tracked files or left" >&2
            echo "untracked ones. Everything it writes belongs in docs/.gitignore." >&2
            git --no-pager status --short >&2
            exit 1
          fi

  cuda-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
    env:
      CUDA_HOME: /usr/local/cuda
    steps:
      - uses: actions/checkout@v4
      - name: Build CUDA target
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo build --features cuda

  vulkan-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Build Vulkan target
        run: |
          apt-get update && apt-get install -y libvulkan-dev
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo build -p pelorus_cli --features vulkan --jobs 2

  lyrical-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:lyrical
    steps:
      - run: |
          apt-get update -y
          apt-get install -y nodejs npm cargo git
      - uses: actions/checkout@v4
      - name: Build lyrical target
        run: |
          cargo build

  glim-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:glim-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build glim integration
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cd pelorus_c
          mkdir -p build
          cd build
          cmake ..
          make
          make install
          cd ../../glim_integration/pelorus_glim_odometry
          mkdir -p build
          cd build
          cmake ..
          make

  examples-regression:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Run API regression tests
        run: |
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          ./scripts/api-regression-tests.bash

  musl-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Check static musl targets
        run: |
          apt-get update && apt-get install -y musl-tools
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add x86_64-unknown-linux-musl
          cargo check --target x86_64-unknown-linux-musl -p pelorus_cli
          cargo check --target x86_64-unknown-linux-musl -p pelorus_cli --no-default-features --features ros2-client,processing-time-export,rayon
          cargo check --target x86_64-unknown-linux-musl -p pelorus_cli --no-default-features --features offline-hiroz,processing-time-export,rayon

  armv7-gnu-build:
    runs-on: ubuntu-dev-resolute
    container:
      image: docker.io/stelzo/ubuntu-dev:resolute
    steps:
      - uses: actions/checkout@v4
      - name: Link armv7 glibc target
        run: |
          set -euo pipefail
          ulimit -n 65536
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version
          rustup target add armv7-unknown-linux-gnueabihf
          cargo zigbuild -p pelorus_cli --target armv7-unknown-linux-gnueabihf

  ros-debs-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker.io/stelzo/ubuntu-dev:lyrical
            distro: lyrical
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            distro: jazzy
          - image: docker.io/stelzo/ubuntu-dev:humble
            distro: humble
    runs-on: ubuntu-dev-resolute
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Check package version consistency
        run: |
          set -euo pipefail
          cargo_ver=$(grep -Po '^\s*version\s*=\s*"\K[^"]+' Cargo.toml)
          xml_ver=$(grep -Po '<\s*version\s*>\K[^<]+' package.xml)
          if [[ "$cargo_ver" != "$xml_ver" ]]; then
            echo "Versions differ! Cargo.toml: $cargo_ver, package.xml: $xml_ver" >&2
            exit 1
          fi
      - name: Check ROS deb build
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          apt-get update -y
          apt-get install -y libclang-dev
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          if [ ! -f "/opt/ros/$DISTRO/setup.bash" ]; then
            echo "No ROS install for $DISTRO in this image" >&2
            exit 1
          fi
          # The ROS setup scripts read unset variables (AMENT_TRACE_SETUP_FILES
          # and friends), so errexit/nounset have to come off while sourcing.
          set +eu
          . "/opt/ros/$DISTRO/setup.bash"
          set -eu
          export ROS_DISTRO="$DISTRO"

          cargo check -p pelorus_cli --no-default-features --features ros2c,rat,rayon --locked

  root-cmake-glim:
    strategy:
      fail-fast: false
      matrix:
        include:
          # - image: docker.io/stelzo/ubuntu-dev:glim-noble
          #   glim: expected
          - image: docker.io/stelzo/ubuntu-dev:jazzy
            glim: absent
    runs-on: ubuntu-dev-resolute
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure the ament package
        env:
          GLIM: ${{ matrix.glim }}
        run: |
          set -euo pipefail
          ulimit -n 65536
          apt-get update -y
          apt-get install -y libclang-dev
          rustup self update
          rustup toolchain uninstall stable
          rustup toolchain install stable
          rustup default stable
          rustc --version

          # The ROS setup scripts read unset variables (AMENT_TRACE_SETUP_FILES
          # and friends), so errexit/nounset have to come off while sourcing.
          set +eu
          for distro in lyrical jazzy humble; do
            if [ -f "/opt/ros/$distro/setup.bash" ]; then
              . "/opt/ros/$distro/setup.bash"
              export ROS_DISTRO="$distro"
              break
            fi
          done
          set -eu
          if [ -z "${ROS_DISTRO:-}" ]; then
            echo "No supported ROS distro found in this image" >&2
            exit 1
          fi

          PREFIX="$(pwd)/install/pelorus"
          cmake -S . -B build/ament-glim -DCMAKE_INSTALL_PREFIX="$PREFIX" 2>&1 | tee configure.log

          if [ "$GLIM" = "expected" ]; then
            grep -q "building the pelorus GLIM odometry plugin" configure.log
            # the plugin has to end up in the package's install rules, otherwise
            # it never reaches the colcon prefix
            grep -rq odometry_estimation_pelorus \
              --include=cmake_install.cmake build/ament-glim
            # the subproject must not force its own prefix onto the parent
            grep -Fq "CMAKE_INSTALL_PREFIX:PATH=$PREFIX" build/ament-glim/CMakeCache.txt
            echo "GLIM plugin is wired into the ament build"
          else
            grep -q "GLIM odometry plugin skipped" configure.log
            ! grep -rq odometry_estimation_pelorus \
              --include=cmake_install.cmake build/ament-glim
            echo "GLIM absent, node configures without the plugin"
          fi
