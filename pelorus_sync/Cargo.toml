[package]
name = "pelorus_sync"
description = "Normalizing and synchronizing Lidar and IMU measurements for odometry estimation, including pre-integration."

version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
pelorus_cuda = { optional = true, workspace = true }
pelorus_metal = { optional = true, workspace = true }
pelorus_vulkan = { optional = true, workspace = true }
ros_pointcloud2.workspace = true
log.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
rayon = { workspace = true, optional = true }
either.workspace = true
rand.workspace = true
imu-fusion.workspace = true
imu-calib = { workspace = true, optional = true }

[features]
downsample = []
cuda = ["std", "dep:pelorus_cuda", "pelorus_cuda/cuda_available", "pelorus_cuda/cuda_enable"]
metal = ["std", "dep:pelorus_metal", "pelorus_metal/metal_available", "pelorus_metal/metal_enable"]
vulkan = ["std", "dep:pelorus_vulkan", "pelorus_vulkan/vulkan_available", "pelorus_vulkan/vulkan_enable"]
no-imu-sync = []
large-processing-queue = []
default = ["std", "rayon", "threads"]
# IMU intrinsics from Kalibr files, the system clock and std types.
std = [
    "pelorus_core/std",
    "dep:imu-calib",
    "anyhow/std",
    "nalgebra/std",
    "either/std",
    "ros_pointcloud2/std",
]
# The threaded `Synchronizer`. Without it only the stepped synchronizer is built.
threads = ["std"]
rayon = [
    "std",
    "dep:rayon",
    "ros_pointcloud2/rayon",
    "pelorus_cuda?/rayon",
    "pelorus_vulkan?/rayon",
]
