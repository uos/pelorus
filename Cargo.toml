[workspace]
members = [
  "crates/cuda",
  "crates/pelorus",
  "crates/pelorus-reg",
  "crates/prelio",
  "crates/prelio-ros2",
  "crates/spole",
]
resolver = "3"

[workspace.package]
edition = "2024"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stelzo/pelorus/"
version = "0.1.0-beta"
rust-version = "1.85"

[workspace.dependencies]
pelorus = { path = "crates/pelorus", version = "0.1.0-beta" }
pelorus-reg = { path = "crates/pelorus-reg", version = "0.1.0-beta" }
prelio = { path = "crates/prelio", version = "0.1.0-beta" }
prelio-ros2 = { path = "crates/prelio-ros2", version = "0.1.0-beta" }
spole = { path = "crates/spole", version = "0.1.0-beta" }
cuda = { path = "crates/cuda", version = "0.1.0-beta" }

uom = { version = "0.37.0", default-features = false, features = [
  "usize",
  "si",
  "f64",
  "f32",
] }
ratslang = "0.2"
ros_pointcloud2 = { version = "0.6", features = [
  "rayon",
  "derive",
] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
r2r = { version = "0.9.5" }
ros2-client = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
rerun = { version = "0.27" }
ros2-interfaces-jazzy-serde = { version = "0.0.4", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ratpub = "0.3.0"
mt_rat = "0.3.0"
anyhow = "1"
sophus_lie = "0.9"
rayon = "1"
dashmap = { version = "6", features = ["rayon", "inline"] }
imu-fusion = "0.2"
imu-calib = "0.1"
color-eyre = "0.6"
futures-lite = "2"
either = "1"
log = "0.4"
env_logger = "0.11.8"
rand = "0.9.2"
rand_pcg = "0.9"
rand_distr = "0.5.1"
nohash-hasher = "0.2.0"
serde = { version = "1", features = ["derive"] }
morton-encoding = "2.0.1"
rustc-hash = "2.1.1"
plotters = "0.3"
petname = "2"
image = "0.25.9"

[profile.release]
lto = "fat"         # Link Time Optimization
codegen-units = 1   # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "symbols"   # Significantly reduce binary size
opt-level = 3
debug = 0
# panic = "abort"

[profile.dbg-release]
inherits = "dev"
opt-level = 3
lto = false
debug = 1

[profile.colcon]
inherits = "release"
incremental = false  # Devs are not expected to use the colcon pipeline for incremental development

[profile.dev.package.backtrace]
opt-level = 3

