[workspace]
members = [
  "pelorus_core",
  "pelorus_cuda",
  "pelorus_metal",
  "pelorus_vulkan",
  "pelorus_cli",
  "pelorus_protocol",
  "pelorus_c",
  "pelorus_c/deb-dev",
  "pelorus_py",
  "pelorus",
  "pelorus_reg",
  "prelio",
  "prelio_io",
  "pelorus_drivers",
  "spole",
  "glim_integration/pelorus_glim_odometry",
]
resolver = "3"

[workspace.package]
edition = "2024"
include = [
  "**/*.rs",
  "**/*.md",
  "**/Cargo.toml",
  "**/pelorus_cuda/**",
  "**/pelorus_vulkan/**",
  "**/pelorus_metal/**",
]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/pelorus/"
version = "0.0.6"
authors = ["Christopher Sieh <stelzo@steado.de>"]
rust-version = "1.89.0"

[workspace.dependencies]
pelorus = { path = "pelorus", version = "0.0.6", default-features = false }
pelorus_core = { path = "pelorus_core", version = "0.0.6" }
pelorus_protocol = { path = "pelorus_protocol", version = "0.0.6" }
pelorus_reg = { path = "pelorus_reg", version = "0.0.6", default-features = false }
prelio = { path = "prelio", version = "0.0.6", default-features = false }
prelio_io = { path = "prelio_io", version = "0.0.6", default-features = false }
spole = { path = "spole", version = "0.0.6", default-features = false }
pelorus_cuda = { path = "pelorus_cuda", version = "0.0.6", default-features = false }
transforms_io = { version = "0.3", default-features = false }
transforms_io_hiroz = { version = "0.3", git = "ssh://git@git.steado.tech/transforms_io.git", tag = "v0.3.0" }
pelorus_metal = { path = "pelorus_metal", version = "0.0.6" }
pelorus_vulkan = { path = "pelorus_vulkan", version = "0.0.6", default-features = false }
pelorus_drivers = { path = "pelorus_drivers", version = "0.0.6", default-features = false }

ros_pointcloud2 = { version = "1.0.0-rc.4", features = [
  "derive",
  "r2r",
  "ros2_interfaces_jazzy_serde",
  "ros2_interfaces_jazzy_rkyv",
  "nalgebra",
] }
ratslang = "0.4.1"
mt_pubsub = "0.9.0"
mt_service = "0.9.0"
cloudini = { version = "0.3.2", default-features = false, features = ["ros"] }
mt_rat = "0.9.0"
imu-calib = "0.1" # TODO use noise calib
marina = "0.2.9"
mcap = "0.24.0"
cdr = "0.2.4"
ros2-interfaces-jazzy-serde = { version = "0.0.4", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
rkyv = "0.8"

once_cell = "1.21"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
faer = { version = "0.24", default-features = false, features = [
  "std",
  "sparse-linalg",
] }
r2r = { version = "0.9.5" }
ros2-client = { version = "0.8" }
hiroz = { version = "0.2.0", git = "https://github.com/ZettaScaleLabs/hiroz.git", tag = "v0.2.0", default-features = false, features = [
  "rmw-zenoh",
  "jazzy",
] }
hiroz-msgs = { version = "0.2.0", git = "https://github.com/ZettaScaleLabs/hiroz.git", tag = "v0.2.0", default-features = false, features = [
  "std_msgs",
  "geometry_msgs",
  "sensor_msgs",
  "nav_msgs",
  "tf2_msgs",
  "jazzy",
] }
hiroz-protocol = { version = "0.2.0", git = "https://github.com/ZettaScaleLabs/hiroz.git", tag = "v0.2.0", default-features = false }
zenoh-buffers = "1.9.0"
tokio = { version = "1.49", default-features = false }
rerun = { version = "0.31", default-features = false, features = [
  "sdk",
  "glam",
] }
anyhow = "1.0"
sophus_lie = "0.15"
rayon = "1.11"
thiserror = "2.0"
velodyne-lidar = "0.3.0"
xsens-mti = "0.7.0"
serialport = { version = "4.9.0", default-features = false }
chrono = "0.4.45"
imu-fusion = "0.2"
futures-lite = "2.6"
either = "1.15"
log = "0.4"
env_logger = "0.11.8"
libc = "0.2"
rand = "0.9.2"
rand_pcg = "0.9"
rand_distr = "0.5.1"
nohash-hasher = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
morton-encoding = "2.0.1"
rustc-hash = "2.1.1"
petname = "2.0"
clap_complete = "4.5.65"
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
  "std",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandQueue",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLLibrary",
  "MTLResource",
] }
objc2-foundation = { version = "0.3", features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSObject",
  "NSRange",
  "NSString",
  "NSURL",
] }
bytemuck = { version = "1", features = ["derive"] }
ash = "0.38"
cc = "1.0"
pkg-config = "0.3"
shaderc = "0.8"
bindgen = "0.72"
walkdir = "2"
cbindgen = "0.29"
serde_json = "1.0.149"
clap = { version = "4.5.53", features = ["derive"] }
mimalloc = { version = "0.1.48", default-features = false }
colorous = "1.0"
ratatui = "0.29"
crossterm = "0.28"
num_cpus = "1.16"
ndarray = "0.17"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }
numpy = "0.27"
kiddo = "5.2.3"
libm = "0.2"

[profile.release]
strip = "symbols" # Significantly reduce binary size
opt-level = 3
debug = 0

[profile.full-release]
inherits = "release"
lto = "thin"         # Link Time Optimization. Larger than "thin" explodes the runner memory
codegen-units = 1    # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "symbols"    # Significantly reduce binary size
opt-level = 3
debug = 0

[profile.dbg-release]
inherits = "dev"
opt-level = 3
lto = false
debug = 1

[profile.colcon]
inherits = "release"

[profile.dev.package.backtrace]
opt-level = 3

