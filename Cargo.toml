[workspace]
members = [
  "pelorus_core",
  "pelorus_cuda",
  "pelorus_metal",
  "pelorus_vulkan",
  "pelorus_wgpu",
  "pelorus_cli",
  "pelorus_docs",
  "pelorus_protocol",
  "pelorus_c",
  "pelorus_c/deb-dev",
  "pelorus_py",
  "pelorus",
  "pelorus_reg",
  "pelorus_sync",
  "pelorus_syncio",
  "pelorus_drivers",
  "pelorus_localmap",
  "pelorus_nostd_check",
  "pelorus_nostd_probe",
  "pelorus_leszy_qemu",
  "glim_integration/pelorus_glim_odometry",
  "pelorus_wasm",
  "pelorus_tui",
  "web",
]
resolver = "3"

[workspace.package]
edition = "2024"
include = [
  "**/*.rs",
  "**/*.md",
  "**/Cargo.toml",
  "**/*.rl",
  "**/*.cu",
  "**/*.cuh",
  "**/*.h",
  "**/*.hpp",
  "**/*.cpp",
  "**/*.metal",
  "**/*.comp",
  "**/*.wgsl",
  "**/LICENSE*",
]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/stelzo/pelorus"
homepage = "https://pelorus.steado.tech"
documentation = "https://pelorus.steado.tech/docs/"
version = "0.1.0"
rust-version = "1.96.0"

[workspace.dependencies]
pelorus = { package = "pelorus_sdk", path = "pelorus", version = "0.1.0", default-features = false }
pelorus_core = { path = "pelorus_core", version = "0.1.0", default-features = false }
pelorus_tui = { path = "pelorus_tui", version = "0.1.0" }
pelorus_protocol = { path = "pelorus_protocol", version = "0.1.0" }
pelorus_reg = { path = "pelorus_reg", version = "0.1.0", default-features = false }
pelorus_sync = { path = "pelorus_sync", version = "0.1.0", default-features = false }
pelorus_syncio = { path = "pelorus_syncio", version = "0.1.0", default-features = false }
pelorus_localmap = { path = "pelorus_localmap", version = "0.1.0", default-features = false }
pelorus_cuda = { path = "pelorus_cuda", version = "0.1.0", default-features = false }
pelorus_metal = { path = "pelorus_metal", version = "0.1.0" }
pelorus_vulkan = { path = "pelorus_vulkan", version = "0.1.0", default-features = false }
pelorus_wgpu = { path = "pelorus_wgpu", version = "0.1.0" }
pelorus_drivers = { path = "pelorus_drivers", version = "0.1.0", default-features = false }

transforms_io = { version = "0.9.0", default-features = false }
ros_pointcloud2 = { version = "1.0.0-rc.6", default-features = false, features = [
  "derive",
  "r2r",
  "ros2_interfaces_jazzy_serde",
  "ros2_interfaces_jazzy_rkyv",
  "nalgebra",
] }
ratslang = { version = "0.5.0", features = ["serde"] }
mt_pubsub = { version = "0.15.0", default-features = false }
mt_service = { version = "0.15.0", default-features = false }
mt_log = { version = "0.15.0", features = ["tui", "env"] }
mt_rat = { version = "0.15.0", default-features = false }
cloudini = { version = "0.3.2", default-features = false, features = ["ros"] }
imu-calib = "0.3"
ros2-interfaces-jazzy-serde = { version = "0.0.7", default-features = false, features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }

rkyv = "0.8"
mcap = "0.26.0"
cdr = "0.2.4"
nalgebra = { version = "0.35", default-features = false, features = [
  "alloc",
  "libm",
  "serde-serialize-no-std",
] }
faer = { version = "0.24", default-features = false, features = ["sparse-linalg"] }
r2r = { version = "0.9.7" }
ros2-client = { version = "0.12" }
hiroz = { version = "0.2.1", default-features = false, features = [
  "rmw-zenoh",
  "jazzy",
] }
hiroz-msgs = { version = "0.2.1", default-features = false, features = [
  "std_msgs",
  "geometry_msgs",
  "sensor_msgs",
  "nav_msgs",
  "tf2_msgs",
  "jazzy",
] }
hiroz-protocol = { version = "0.2.1", default-features = false }
zenoh-buffers = "1.10.2"
tokio = { version = "1.54", default-features = false }
rerun = { version = "0.43.2", default-features = false, features = [
  "sdk",
  "glam",
] }
anyhow = { version = "1.0", default-features = false }
ureq = "3.5"
rayon = "1.12"
thiserror = { version = "2.0", default-features = false }
velodyne-lidar = "0.3.0"
xsens-mti = "0.7.0"
serialport = { version = "4.10.1", default-features = false }
chrono = "0.4.45"
imu-fusion = "0.2"
hashbrown = "0.17"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
spin = { version = "0.12", default-features = false, features = [
  "once",
  "rwlock",
  "spin_mutex",
] }
futures-lite = "2.6"
either = { version = "1.19", default-features = false }
log = "0.4"
env_logger = "0.11.11"
libc = "0.2"
rand = { version = "0.10.3", default-features = false }
rand_pcg = "0.10"
rand_distr = { version = "0.6.0", default-features = false }
nohash-hasher = { version = "0.2.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
] }
rustc-hash = { version = "2.1.3", default-features = false }
petname = "3.2"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
  "std",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandQueue",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLLibrary",
  "MTLResource",
] }
objc2-foundation = { version = "0.3", features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSObject",
  "NSRange",
  "NSString",
  "NSURL",
] }
bytemuck = { version = "1", features = ["derive"] }
ash = "0.38"
cc = "1.10"
pkg-config = "0.3"
shaderc = "0.10"
bindgen = "0.73"
walkdir = "2"
cbindgen = "0.29"
serde_json = "1.0.154"
mimalloc = { version = "0.1.52", default-features = false }
colorous = "1.0"
ratatui = { version = "0.30", default-features = false, features = [
  "std",
  "layout-cache",
  "underline-color",
] }
crossterm = "0.29"
num_cpus = "1.17"
ndarray = "0.17"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
libm = "0.2"

[profile.release]
strip = "symbols" # Significantly reduce binary size
opt-level = 3
debug = 0

[profile.full-release]
inherits = "release"
lto = "thin"         # Link Time Optimization. Larger than "thin" explodes the runner memory
codegen-units = 1    # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "symbols"    # Significantly reduce binary size
opt-level = 3
debug = 0

[profile.dbg-release]
inherits = "dev"
opt-level = 3
lto = false
debug = 1

[profile.colcon]
inherits = "release"

[profile.dev.package.backtrace]
opt-level = 3

