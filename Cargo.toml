[package]
name = "lio"
version = "0.1.0"
edition = "2021"

[dependencies]
ros_pointcloud2 = { version = "0.5.0-rc.2", features = ["r2r_msg"] }
r2r = "0.8.4"
futures = "0.3.15"
tokio = { version = "1", features = ["full"] }
nalgebra = "0.32.2"
tf_r2r = { version = "0.1.0", features = ["ros2"] }
lifis = { path = "../lifis" }

[build-dependencies]
bindgen = "0"
cmake = "0"
cc = "1"

[profile.colcon]
inherits = "release"

[profile.release]
lto = "fat"
panic = "abort"
strip = "debuginfo"
