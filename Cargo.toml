[workspace]
members = [
    "crates/pelorus",
    "crates/pelorus-reg",
    "crates/prelio",
    "crates/prelio-ros2",
]
resolver = "2"

[workspace.package]
edition = "2021"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stelzo/pelorus/"
version = "0.1.0"

[workspace.dependencies]
pelorus = { path = "crates/pelorus", version = "0.1.0" }
pelorus-reg = { path = "crates/pelorus-reg", version = "0.1.0" }
prelio = { path = "crates/prelio", version = "0.1.0" }
prelio-ros2 = { path = "crates/prelio-ros2", version = "0.1.0" }

ros_pointcloud2 = { version = "0.5.1", features = [
    "r2r_msg",
    "nalgebra",
    "rayon",
    "derive",
] }
r2r = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
nalgebra = "0.33"
#small_gicp-sys = { git = "ssh://git@github.com/stelzo/small_gicp-sys.git", branch = "main" }
tf_r2r = { version = "0.2", features = ["ros2"] }
anyhow = "1"
sophus_lie = "0.9"
rayon = "1"
dashmap = { version = "6", features = ["rayon", "inline"] }
imu-fusion = "0.2"
imu-calib = "0.1"
color-eyre = "0.6"
futures-lite = "2"
