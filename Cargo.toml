[workspace]
members = [
  "pelorus_core",
  "pelorus_cuda",
  "pelorus_cli",
  "pelorus_c",
  "pelorus_c/deb-dev",
  "pelorus_py",
  "pelorus",
  "pelorus_reg",
  "prelio",
  "prelio_io",
  "spole",
  "glim_integration/pelorus_glim_odometry",
]
resolver = "3"

[workspace.package]
edition = "2024"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml", "**/pelorus_cuda/**"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/uos-robotics/pelorus/"
version = "0.0.2"
authors = ["Christopher 'stelzo' Sieh <stelzo@steado.de>"]
rust-version = "1.85"                                                   # ROS lyrical

[workspace.dependencies]
pelorus_cli = { path = "pelorus_cli", version = "0.0.2" }
pelorus = { path = "pelorus", version = "0.0.2" }
pelorus_core = { path = "pelorus_core", version = "0.0.2" }
pelorus_reg = { path = "pelorus_reg", version = "0.0.2" }
prelio = { path = "prelio", version = "0.0.2" }
prelio_io = { path = "prelio_io", version = "0.0.2" }
spole = { path = "spole", version = "0.0.2" }
pelorus_cuda = { path = "pelorus_cuda", version = "0.0.2" }

ros_pointcloud2 = { version = "1.0.0-rc.3", features = [
  "rayon",
  "derive",
  "r2r",
  "ros2_interfaces_jazzy_serde",
  "ros2_interfaces_jazzy_rkyv",
  "nalgebra",
] }
ratslang = "0.4.1"
ratpub = { version = "0.5.3" }
mt_rat = { version = "0.5.3" }
imu-calib = "0.1" # TODO use noise calib

once_cell = "1.21"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
faer = { version = "0.23", default-features = false, features = [
  "std",
  "rayon",
  "sparse-linalg",
] }
r2r = { version = "0.9.5" }
ros2-client = { version = "0.8" }
tokio = { version = "1.49", default-features = false }
rerun = { version = "0.29", default-features = false, features = [
  "sdk",
  "glam",
] }
ros2-interfaces-jazzy-serde = { version = "0.0.4", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.5", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
anyhow = "1.0"
sophus_lie = "0.15"
rayon = "1.11"
thiserror = "2.0" # only used in tf implementations
imu-fusion = "0.2"
futures-lite = "2.6"
either = "1.15"
log = "0.4"
env_logger = "0.11.8"
libc = "0.2"
rand = "0.9.2"
rand_pcg = "0.9"
rand_distr = "0.5.1"
nohash-hasher = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
morton-encoding = "2.0.1"
rustc-hash = "2.1.1"
plotters = "0.3"
petname = "2.0"
clap_complete = "4.5.65"

[profile.release]
lto = "thin"      # Link Time Optimization
codegen-units = 1 # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "symbols" # Significantly reduce binary size
opt-level = 3
debug = 0

[profile.dbg-release]
inherits = "dev"
opt-level = 3
lto = false
debug = 1

[profile.colcon]
inherits = "release"

[profile.dev.package.backtrace]
opt-level = 3

