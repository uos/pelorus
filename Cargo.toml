[workspace]
members = [
  "crates/pelorus",
  "crates/pelorus-reg",
  "crates/prelio",
  "crates/prelio-ros2",
  "crates/spole",
]
resolver = "2"

[workspace.package]
edition = "2024"
include = ["**/*.rs", "**/*.md", "**/Cargo.toml"]
keywords = ["robotics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/stelzo/pelorus/"
version = "0.1.0"

[workspace.dependencies]
pelorus = { path = "crates/pelorus", version = "0.1.0" }
pelorus-reg = { path = "crates/pelorus-reg", version = "0.1.0" }
prelio = { path = "crates/prelio", version = "0.1.0" }
prelio-ros2 = { path = "crates/prelio-ros2", version = "0.1.0" }
spole = { path = "crates/spole", version = "0.1.0" }

ros_pointcloud2 = { version = "0.5.3", features = [
  "nalgebra",
  "rayon",
  "derive",
], git = "https://github.com/stelzo/ros_pointcloud2.git", branch = "rkyv" }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
r2r = { version = "0.9.5" }
ros2-client = { version = "0.7.6" }
tokio = { version = "1", features = ["full"] }
rerun = { version = "0.23.1" }
ros2-interfaces-jazzy = { version = "0.0.4", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
] }
ros2-interfaces-jazzy-rkyv = { version = "0.0.4", features = [
  "std_msgs",
  "geometry_msgs",
  "nav_msgs",
  "sensor_msgs",
  "visualization_msgs",
  "tf2_msgs",
  "builtin_interfaces",
], git = "https://github.com/stelzo/ros2-interfaces-jazzy-rkyv.git", branch = "main" }
ratpub = { version = "0.1.0-rc.1", git = "https://github.com/uos/minot", branch = "main" }
rat = { version = "0.1.0-rc.1", git = "https://github.com/uos/minot", branch = "main" }
small_gicp-sys = { version = "0.1.0", git = "ssh://git@github.com/stelzo/small_gicp-sys.git", rev = "30da271" }
gtsam-sys = { version = "0.1.0", git = "https://github.com/stelzo/gtsam-sys.git", branch = "main" }
anyhow = "1"
sophus_lie = "0.9"
rayon = "1"
dashmap = { version = "6", features = ["rayon", "inline"] }
imu-fusion = "0.2"
imu-calib = "0.1"
color-eyre = "0.6"
futures-lite = "2"
either = "1"
log = "0.4"
env_logger = "0.11.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8.20"

