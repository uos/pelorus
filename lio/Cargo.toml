[package]
name = "lio"
version = "0.1.0"
edition = "2021"

[dependencies]
ros_pointcloud2 = { version = "0.5.0-rc.3", features = [
    "r2r_msg",
    "nalgebra",
    "rayon",
] }
r2r = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
lifis-ros = { path = "/home/csieh/projects/lifis-ros" }
nalgebra = "0.32"
small_gicp-rs = { path = "/home/csieh/projects/small_gicp-rs" }
tf_r2r = { version = "0.2", features = ["ros2"] }

[build-dependencies]
bindgen = "0"
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = "fat"
panic = "abort"
strip = "debuginfo"
