examples-regression:
 stage: test
 image: ubuntu:latest
 script:
   - apt-get update && apt-get install -y build-essential cmake python3 python3-pip libpcl-dev libeigen3-dev pkg-config
   - rustup default stable
   - cargo build
   - pip3 install maturin
   - cd pelorus_py
   - maturin develop
   - cd ../pelorus_c/examples
   - make regression
 rules:
   - if: '$CI_PIPELINE_SOURCE == "push"'
   - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
   - if: '$CI_COMMIT_BRANCH == "main"'
   - if: '$CI_PIPELINE_SOURCE == "schedule"'
     when: never

