lyrical: # verify that we can build on Ubuntu 26 LTS (TODO currently Trixie)
  image: debian:trixie
  stage: build
  script:
    - apt-get update
    - apt-get install -y cargo
    - apt-get install -y git # TODO only needed until ratslang patch is published
    - cargo build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

glim-odom:
  image: docker.io/stelzo/ubuntu-dev:glim-noble
  stage: build
  script:
    - cd pelorus_c && mkdir build && cd build
    - cmake ..
    - make && make install
    - cd ../../glim_integration/pelorus_glim_odometry && mkdir build && cd build
    - cmake ..
    - make
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

examples-regression:
  stage: test
  script:
    - ./scripts/api-regression-tests.bash
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
