image: rust:latest

variables:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "full"

stages:
  - build

before_script:
  - apt-get update
  - apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu musl-tools libc6-dev-riscv64-cross gcc-arm-linux-gnueabihf

rust-latest:
  stage: build
  script:
    - rustup default stable
    - cargo build --verbose
    - cargo test --verbose

rust-nightly:
  stage: build
  image: rust:nightly
  script:
    - cargo build --verbose
    - cargo test --verbose
  allow_failure: true

.build_template: &build_defaults
  stage: build
  script:
    - rustup target add $RUST_TARGET
    - RUSTFLAGS="-C target-feature=+crt-static" cargo build --target $RUST_TARGET --features mimalloc --release
  artifacts:
    paths:
      - target/$RUST_TARGET/release/pelorus

build:linux:x86_64-musl:
  <<: *build_defaults
  variables:
    RUST_TARGET: x86_64-unknown-linux-musl

build:linux:x86_64-gnu:
  <<: *build_defaults
  variables:
    RUST_TARGET: x86_64-unknown-linux-gnu

build:linux:aarch64:
  <<: *build_defaults
  variables:
    RUST_TARGET: aarch64-unknown-linux-gnu

build:linux:armv7:
  <<: *build_defaults
  variables:
    RUST_TARGET: armv7-unknown-linux-gnueabihf

build:linux:riscv64:
  <<: *build_defaults
  variables:
    RUST_TARGET: riscv64gc-unknown-linux-gnu
