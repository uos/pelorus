# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json

image: ubuntu:latest

variables:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "full"

stages:
  - build
  - test

before_script:
  - apt-get update
  - apt-get install -y curl git python3 python3-pip clang
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - source "$HOME/.cargo/env"
  - rustup default stable
  - pip3 install maturin[zig] --break-system-packages

rust-stable:
  stage: build
  script:
    - rustup default stable
    - cargo build --verbose
    - cargo test --verbose
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

rust-nightly:
  stage: build
  script:
    - rustup default nightly
    - cargo build --verbose
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

lyrical: # verify that we can build on Ubuntu 26 LTS (TODO currently Trixie)
  image: debian:trixie
  stage: build
  script:
    - apt-get install -y cargo
    - cargo build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

msrv:
  stage: test
  script:
    - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
    - cargo binstall cargo-msrv --no-confirm
    - cargo msrv verify --manifest-path pelorus/Cargo.toml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

examples-regression:
  stage: test
  image: ubuntu:latest
  script:
    - apt-get update && apt-get install -y build-essential cmake python3 python3-pip libpcl-dev libeigen3-dev pkg-config
     - rustup default stable
     - cargo build
     - pip3 install maturin
     - cd pelorus_py
     - maturin develop
     - cd ../pelorus_c/examples
     - make regression
  rules:
     - if: '$CI_PIPELINE_SOURCE == "schedule"'
       when: never
     - when: on_success

