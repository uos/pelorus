# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json

image: docker.io/stelzo/ubuntu-dev:noble

variables:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "full"

stages:
  - build
  - test

rust-stable:
  stage: build
  script:
    - rustup default stable
    - cargo build --verbose
    - cargo test --verbose
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

rust-nightly:
  stage: build
  script:
    - rustup default nightly
    - cargo build --verbose
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

lyrical: # verify that we can build on Ubuntu 26 LTS (TODO currently Trixie)
  image: debian:trixie
  stage: build
  script:
    - apt-get install -y cargo
    - cargo build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

msrv:
  stage: test
  script:
    - cargo msrv verify --manifest-path pelorus/Cargo.toml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

examples-regression:
  stage: test
  image: ubuntu:latest
  script:
     - apt-get install -y build-essential cmake libpcl-dev libeigen3-dev pkg-config
     - rustup default stable
     - cargo build
     - cd pelorus_py
     - maturin develop
     - cd ../pelorus_c/examples
     - make regression
  rules:
     - if: '$CI_PIPELINE_SOURCE == "schedule"'
       when: never
     - when: on_success

