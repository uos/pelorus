# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json

image: docker.io/stelzo/ubuntu-dev:noble

variables:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "full"
  RUST_FONTCONFIG_DLOPEN: "1"

stages:
  - build
  - test

rust-stable:
  stage: build
  script:
    - rustup default stable
    - cargo build
    - RUSTFLAGS="-C panic=abort" cargo build -p pelorus_pico --release
    - cargo test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

cuda-13-1:
 stage: build
 image: docker.io/stelzo/ubuntu-dev:noble-cu13-1
 tags:
    - macos-latest
 script:
   - export CUDA_HOME=/usr/local/cuda
   - rustup default stable
   - cargo build --features cuda --jobs 2
 rules:
   - if: '$CI_PIPELINE_SOURCE == "schedule"'
     when: never
   - when: on_success

