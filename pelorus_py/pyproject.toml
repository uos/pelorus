[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pelorus"
version = "0.1.0b0"
description = "Python bindings for Pelorus - LiDAR-Inertial Odometry"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["robotics", "lidar", "odometry", "slam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "numpy>=1.16",
]

[project.optional-dependencies]
mcap = ["mcap>=1.0.0", "mcap-ros2-support>=0.5.0"]
dev = ["pytest>=7.0", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/stelzo/pelorus"
Repository = "https://github.com/stelzo/pelorus"

[tool.maturin]
python-source = "python"
module-name = "pelorus"
features = ["pyo3/extension-module"]
