[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pelorus"
dynamic = ["version"]
description = "Pelorus - Resource-aware Lidar-Inertial Odometry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["robotics", "lidar", "odometry", "lio", "slam"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Framework :: Robot Framework :: Library",
]
dependencies = ["numpy>=1.16"]

[project.urls]
Homepage = "https://pelorus.steado.tech"
Documentation = "https://pelorus.steado.tech/docs/"
Repository = "https://codeberg.org/stelzo/pelorus"

[project.optional-dependencies]
mcap = ["mcap-ros2-support>=0.5.7,<0.6.0"]
cli = ["pelorus-cli[rerun]"]
all = ["pelorus-cli[rerun]", "mcap-ros2-support>=0.5.7,<0.6.0", "dedrunk-cli", "marina-cli"]

[tool.maturin]
python-source = "python"
module-name = "pelorus"
features = ["pyo3/extension-module"]
