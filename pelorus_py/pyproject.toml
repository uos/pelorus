[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pelorus"
dynamic = ["version"]
description = "Pelorus - High Efficient Lidar Inertial Odometry"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["robotics", "lidar", "odometry", "lio", "slam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Robotics",
]
dependencies = [
    "numpy>=1.16",
]

[project.optional-dependencies]
mcap = ["mcap-ros2-support>=0.5.7,<0.6.0"]
cli = ["pelorus-cli[rerun]"]
all = ["pelorus-cli[rerun]", "mcap-ros2-support>=0.5.7,<0.6.0"]

[project.urls]
Homepage = "https://github.com/uos/pelorus"
Repository = "https://github.com/uos/pelorus"

[tool.maturin]
python-source = "python"
module-name = "pelorus"
features = ["pyo3/extension-module"]
