[package]
name = "pelorus_py"
description = "Python bindings for Pelorus Odometry."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus_py"
crate-type = ["cdylib"]

[dependencies]
pelorus_core.workspace = true
pelorus_reg = { workspace = true, default-features = false, features = ["threads"] }
pelorus_sync = { workspace = true, default-features = false, features = ["threads"] }
pelorus_localmap = { workspace = true, default-features = false }
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
nalgebra.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
ratslang.workspace = true
rayon = { workspace = true, optional = true }

ndarray.workspace = true
pyo3.workspace = true
numpy.workspace = true

[features]
default = ["processing-time-export", "rayon"]
rayon = [
    "dep:rayon",
    "pelorus_sync/rayon",
    "pelorus_reg/rayon",
    "pelorus_localmap/rayon",
    "ros_pointcloud2/rayon",
]
downsample = ["pelorus_sync/downsample"]
cuda = ["pelorus_sync/cuda", "pelorus_reg/cuda"]
metal = ["pelorus_sync/metal", "pelorus_reg/metal"]
vulkan = ["pelorus_sync/vulkan", "pelorus_reg/vulkan"]
no-imu-sync = ["pelorus_sync/no-imu-sync"]
large-processing-queue = ["pelorus_sync/large-processing-queue"]
processing-time-export = ["pelorus_reg/processing-time-export"]
