[package]
name = "pelorus_py"
description = "Python bindings for Pelorus Odometry."
publish = false
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "pelorus_py"
crate-type = ["cdylib"]

[dependencies]
pelorus = { workspace = true, default-features = false, features = ["threads", "http-config"] }
ros_pointcloud2.workspace = true
ros2-interfaces-jazzy-serde.workspace = true
log.workspace = true
env_logger.workspace = true

ndarray.workspace = true
pyo3.workspace = true
numpy.workspace = true

[features]
default = ["processing-time-export", "rayon"]
rayon = ["pelorus/rayon"]
downsample = ["pelorus/downsample"]
cuda = ["pelorus/cuda"]
metal = ["pelorus/metal"]
vulkan = ["pelorus/vulkan"]
no-imu-sync = ["pelorus/no-imu-sync"]
large-processing-queue = ["pelorus/large-processing-queue"]
processing-time-export = ["pelorus/processing-time-export"]
