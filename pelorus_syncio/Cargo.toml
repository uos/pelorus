[package]
name = "pelorus_syncio"
description = "IO layer for pelorus_sync"

version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
# Rerun needs a newer Rust than the libraries.
rust-version = "1.98.0"

[dependencies]
pelorus_core = { workspace = true, features = ["std"] }
pelorus_protocol = { workspace = true, optional = true }
pelorus_drivers = { workspace = true, optional = true }
ros_pointcloud2.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
futures-lite.workspace = true
pelorus_sync = { workspace = true, default-features = false, features = ["threads"] }
log.workspace = true
env_logger.workspace = true
ros2-client = { workspace = true, optional = true }
ros2-interfaces-jazzy-serde = { workspace = true, optional = true }
thiserror.workspace = true
r2r = { workspace = true, optional = true }
rerun = { workspace = true, optional = true }
mt_pubsub = { workspace = true, optional = true }
cloudini = { workspace = true, optional = true }
hiroz = { workspace = true, optional = true }
hiroz-msgs = { workspace = true, optional = true }
hiroz-protocol = { workspace = true, optional = true }
zenoh-buffers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "time"] }
mt_rat = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
transforms_io = { workspace = true }

[features]
default = ["rayon", "compressed-pointcloud"]
rayon = ["pelorus_sync/rayon", "ros_pointcloud2/rayon"]
rat = ["dep:mt_rat"]
minot-full-transports = ["mt_pubsub?/zenoh-defaults", "mt_rat?/zenoh-defaults"]
# Shared memory between Pelorus and Minot on one machine, for Zenoh and QUIC alike.
shm = ["mt_pubsub?/shm", "mt_rat?/shm", "transforms_io/shm"]
downsample = ["pelorus_sync/downsample"]
cuda = ["pelorus_sync/cuda"]
metal = ["pelorus_sync/metal"]
vulkan = ["pelorus_sync/vulkan"]
no-imu-sync = ["pelorus_sync/no-imu-sync"]
large-processing-queue = ["pelorus_sync/large-processing-queue"]
native-drivers = ["dep:pelorus_drivers", "pelorus_drivers/native-drivers"]
velodyne-driver = ["native-drivers", "pelorus_drivers/velodyne-driver"]
xsens-driver = ["native-drivers", "pelorus_drivers/xsens-driver"]
ouster-driver = ["native-drivers", "pelorus_drivers/ouster-driver"]
robosense-driver = ["native-drivers", "pelorus_drivers/robosense-driver"]
sensor-drivers = [
    "velodyne-driver",
    "xsens-driver",
    "ouster-driver",
    "robosense-driver",
]
rerun = ["dep:rerun"]
compressed-pointcloud = ["dep:cloudini", "dep:rkyv", "dep:pelorus_protocol"]
mt_pubsub = [
    "dep:mt_pubsub",
    "dep:tokio",
    "dep:ros2-interfaces-jazzy-rkyv",
    "transforms_io/mt-pubsub",
]
ros2-client = [
    "dep:ros2-client",
    "dep:ros2-interfaces-jazzy-serde",
    "ros2-interfaces-jazzy-serde/ros2-client",
    "transforms_io/ros2-client",
]
r2r = ["dep:r2r", "pelorus_core/r2r", "transforms_io/r2r"]
hiroz = [
    "dep:hiroz",
    "dep:hiroz-msgs",
    "dep:hiroz-protocol",
    "dep:tokio",
    "dep:zenoh-buffers",
    "ros_pointcloud2/hiroz",
    "transforms_io/hiroz",
]
