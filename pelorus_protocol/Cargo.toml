[dependencies]
# Wire types only. Adding Cloudini or ros_pointcloud2 here — even as optional
# dependencies, which still take part in version resolution — imposes those
# versions on every viewer that depends on this crate. Codec helpers belong in
# the consumers, next to the Cloudini they already build with.
rkyv.workspace = true
serde.workspace = true
