[package]
name = "pelorus_drivers"
description = "Optional native sensor drivers and transport-neutral ingress for Pelorus."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
thiserror.workspace = true
velodyne-lidar = { workspace = true, optional = true }
xsens-mti = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
velodyne-driver = ["dep:velodyne-lidar", "dep:chrono"]
xsens-driver = ["dep:xsens-mti", "dep:serialport", "dep:chrono"]
ouster-driver = ["dep:serde", "dep:serde_json"]
sensor-drivers = ["velodyne-driver", "xsens-driver", "ouster-driver"]
