[package]
name = "pelorus_drivers"
description = "Optional native sensor drivers and transport-neutral ingress for Pelorus."
edition.workspace = true
include.workspace = true
keywords.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core = { workspace = true, features = ["std"] }
thiserror.workspace = true
log.workspace = true
velodyne-lidar = { workspace = true, optional = true }
xsens-mti = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
native-drivers = []
velodyne-driver = ["native-drivers", "dep:velodyne-lidar", "dep:chrono"]
xsens-driver = ["native-drivers", "dep:xsens-mti", "dep:serialport", "dep:chrono"]
ouster-driver = ["native-drivers", "dep:serde", "dep:serde_json"]
robosense-driver = ["native-drivers"]
sensor-drivers = [
    "velodyne-driver",
    "xsens-driver",
    "ouster-driver",
    "robosense-driver",
]
