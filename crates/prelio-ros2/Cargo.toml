[package]
name = "prelio-ros2"
description = "ROS2 Wrapper for prelio"

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true

[dependencies]
ros_pointcloud2.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
futures-lite.workspace = true
prelio.workspace = true
log.workspace = true
env_logger.workspace = true
ros2-client = { workspace = true, optional = true }
ros2-interfaces-jazzy = { workspace = true, optional = true }
serde.workspace = true
thiserror = "1.0"
r2r = { workspace = true, optional = true }
rerun = { workspace = true, optional = true }
ratpub = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }

[features]
# default = ["ratpub"]
# default = ["ros2-client"]
cuda = ["prelio/cuda"]
parallel = ["prelio/parallel"]
no-imu-sync = ["prelio/no-imu-sync"]
rerun = ["dep:rerun"]
ratpub = [
  "dep:ratpub",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
  "ros_pointcloud2/lh",
]
gtsam = ["prelio/gtsam"]
ros2-client = [
  "dep:ros2-client",
  "dep:ros2-interfaces-jazzy",
  "ros_pointcloud2/ros2-interfaces-jazzy",
]
r2r = ["dep:r2r", "ros_pointcloud2/r2r_msg"]
