[package]
name = "pelorus"
description = "Lidar Inertial Odometry"
version = "0.1.0"
edition = "2021"

[dependencies]
ros_pointcloud2.workspace = true
prelio-ros2.workspace = true
pelorus-reg.workspace = true
ros2-client = { workspace = true, optional = true }
nalgebra.workspace = true
anyhow.workspace = true
color-eyre.workspace = true
rand.workspace = true
either.workspace = true
env_logger.workspace = true
log.workspace = true
ros2-interfaces-jazzy = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true
rerun = { workspace = true, optional = true }
futures-lite.workspace = true
mimalloc = { version = "0.1.43", default-features = false, optional = true }
clap = { version = "4.5.28", features = ["derive"] }
r2r = { workspace = true, optional = true }
ratpub = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rat = { workspace = true, optional = true }
small_gicp-sys = { workspace = true, optional = true }
cuda = { optional = true, workspace = true }
rustc-hash.workspace = true
ratslang.workspace = true
uom.workspace = true
sophus_lie = { workspace = true, optional = true }
plotters = { workspace = true, optional = true }
petname = { workspace = true, optional = true }
image = { workspace = true, optional = true }
colorous = "1.0"

[features]
default = ["mimalloc", "downsample"]
# default = ["dev"] # toggled in development

# -#-#-#-#-#- Sensor Communication -#-#-#-#-#-

# ROS2 Node via C bindings. See the lio.toml for controlling QoS.
ros2c = ["r2r"]

# ROS2 with Rust native implementation. No ROS2 installation required. See the lio.toml for controlling QoS.
ros2-rust = ["ros2-client"]

# Custom Rust-only pub/sub implementation used in my offline-mapping, development and debugging workflow (see https://uos.github.io/minot/#native-publishsubscribe).
ratpub = [
  "dep:ratpub",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
  "ros_pointcloud2/lh",
  "prelio-ros2/ratpub",
]

# -#-#-#-#-#- Performance and Methods -#-#-#-#-#-

# The input scan is reduced for faster registration (resolution affects accuracy)
downsample = ["prelio-ros2/downsample"]

# Build and use CUDA accelerations
cuda = ["prelio-ros2/cuda", "dep:cuda", "pelorus-reg/cuda"]

# Switch to threadpool workstealing whenever large buffers are processed. The cuda feature has higher precedence, but not every parallel part is implemented with cuda, so a combination of both flags make sense.
parallel = ["prelio-ros2/parallel", "pelorus-reg/parallel"]

# Lidar Odometry only with parallel ICP, ignore IMU
lidar_only = ["gicp"]

# Lidar + IMU with naiive kdtree for neighborsearch. Currently slow and unstable. Use only with good reason.
kdtree = ["pelorus-reg/nn_kdt"]

# Enables synchronization with a bagfile using Minot (https://uos.github.io/minot/)
offline = ["ratpub", "rat"]

# Use Mimalloc as allocator. General speedup when using dynamic memory.
mimalloc = ["dep:mimalloc"]

# -#-#-#-#-#- Visualizations -#-#-#-#-#-

# Visualize data with rerun. Set the `RERUN_SERVER_ADDR` env variable to your rerun instance, default is '127.0.0.1:9876'.
rerun = ["dep:rerun", "prelio-ros2/rerun"]

# Collect undistorted and registered scans to a map. WARNING: This feature is really naiive right now and slows down computation dramatically. In combination with the "offline" flag, the synchronization for "rat" will move to post-mapping.
mapping = []

# Publish the localmap. WARNING: You should only enable this for debugging or you want to fiddle with the config. Getting the map is inefficient and unoptimized.
map = []

# Skips publishing any visualizations that take too much compute resources (e.g. iterating a point cloud)
no-viz = []

# Export the trajectory to the TUM format and enable the visualization tools (`evaluate` subcommand) for comparing against ground truths.
trajectory = ["dep:petname", "dep:sophus_lie", "dep:plotters", "dep:image"]

# -#-#-#-#-#- Low level -#-#-#-#-#-

# Toggle tooling typically used for development
dev = ["offline", "downsample", "rerun", "map", "trajectory"]

# Use variable syncing for triggers
rat = ["dep:rat", "dep:tokio"]

# Uses small_gicp as backend, which requires Eigen3 to be installed.
gicp = ["dep:small_gicp-sys", "prelio-ros2/no-imu-sync"]

# Use native ROS2 as pub/sub system
ros2-client = [
  "dep:ros2-client",
  "dep:ros2-interfaces-jazzy",
  "ros_pointcloud2/ros2-interfaces-jazzy",
  "prelio-ros2/ros2-client",
]

# Use rclc bindings as pub/sub system
r2r = ["dep:r2r", "ros_pointcloud2/r2r_msg", "prelio-ros2/r2r"]

[profile.release]
lto = true          # Link Time Optimization
codegen-units = 1   # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "debuginfo" # Significantly reduce binary size
opt-level = 3
panic = "abort"

[profile.dev.package.backtrace]
opt-level = 3
