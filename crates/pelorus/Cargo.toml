[package]
name = "pelorus"
description = "Lidar Inertial Odometry"
version = "0.1.0"
edition = "2021"

[dependencies]
ros_pointcloud2.workspace = true
prelio-ros2 = { workspace = true, default-features = false }
pelorus-reg.workspace = true
ros2-client = { workspace = true, optional = true }
nalgebra.workspace = true
#small_gicp-sys = { git = "ssh://git@github.com/stelzo/small_gicp-sys.git", branch = "main" }
anyhow.workspace = true
color-eyre.workspace = true
rand.workspace = true
either.workspace = true
env_logger.workspace = true
log.workspace = true
ros2-interfaces-jazzy = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true
rerun = { workspace = true, optional = true }
futures-lite.workspace = true
mimalloc = { version = "0.1.43", optional = true }
clap = { version = "4.5.28", features = ["derive"] }
r2r = { workspace = true, optional = true }
ratpub = { workspace = true, optional = true }
ros2-interfaces-jazzy-rkyv = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rat = { workspace = true, optional = true }

#[build-dependencies]
#bindgen = "0.69"
#cc = "1"
#pkg-config = "0.3"

[features]
default = ["dev"]
dev = ["rerun", "lh", "pelorus-reg/nn_kdt", "rat"]
rat = ["dep:rat"]
mimalloc = ["dep:mimalloc"]
rerun = ["dep:rerun", "prelio-ros2/rerun"]
lh = [
  "dep:ratpub",
  "dep:tokio",
  "dep:ros2-interfaces-jazzy-rkyv",
  "ros_pointcloud2/lh",
  "prelio-ros2/lh",
]
ros2-client = [
  "dep:ros2-client",
  "dep:ros2-interfaces-jazzy",
  "ros_pointcloud2/ros2-interfaces-jazzy",
  "prelio-ros2/ros2-client",
]
r2r = ["dep:r2r", "ros_pointcloud2/r2r_msg", "prelio-ros2/r2r"]


[profile.release]
lto = true          # Link Time Optimization
codegen-units = 1   # Slower compile times but compiler sees all generated code and can optimize over everything across modules. Also decreases binary size.
strip = "debuginfo" # Significantly reduce binary size

[profile.dev.package.backtrace]
opt-level = 3
