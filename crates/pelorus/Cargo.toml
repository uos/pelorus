# colcon tools do not support workspace package markings since the package toml will be installed in share, so this is a copy of the workspace

[package]
name = "pelorus"
description = "LiDAR Odometry"
version = "0.1.0"
edition = "2021"

[dependencies]
ros_pointcloud2 = { version = "0.5.2", features = [
    "r2r_msg",
    "nalgebra",
    "rayon",
    "derive",
], git = "https://github.com/stelzo/ros_pointcloud2.git" }
prelio-ros2 = { version = "0.1", path = "../prelio-ros2" }
pelorus-reg = { version = "0.1", path = "../pelorus-reg" }
r2r = "0.9"
futures = "0.3"
nalgebra = "0.33"
#small_gicp-sys = { git = "ssh://git@github.com/stelzo/small_gicp-sys.git", branch = "main" }
anyhow = "1"
color-eyre = "0.6"
rand = "0.8"
either = "1"

#[build-dependencies]
#bindgen = "0.69"
#cc = "1"
#pkg-config = "0.3"

#[profile.release]
#lto = "fat"
#panic = "abort"
#strip = "debuginfo"

[profile.dev.package.backtrace]
opt-level = 3

[package.metadata.ros]
install_to_share = ["launch"]
