[package]
name = "pelorus_reg"
description = "Lidar Scan Registration Module for Pelorus Odometry Library."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
prelio.workspace = true
pelorus_cuda = { workspace = true, optional = true }
pelorus_metal = { workspace = true, optional = true }
ros_pointcloud2.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
faer.workspace = true
sophus_lie.workspace = true
rayon.workspace = true
spole.workspace = true
log.workspace = true
serde.workspace = true
either.workspace = true

[features]
default = []
nn_kdt = ["spole/nn_kdt"]
cuda = ["dep:pelorus_cuda", "pelorus_cuda/cuda_available", "pelorus_cuda/cuda_enable", "prelio/cuda"]
metal = ["dep:pelorus_metal", "pelorus_metal/metal_available", "pelorus_metal/metal_enable", "prelio/metal"]

[dev-dependencies]
serde_json = "1.0.149"
