[package]
name = "pelorus_reg"
description = "Lidar Scan Registration Module for Pelorus Odometry Library."

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
include.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
pelorus_core.workspace = true
pelorus_sync = { workspace = true, default-features = false }
pelorus_cuda = { workspace = true, optional = true }
pelorus_metal = { workspace = true, optional = true }
pelorus_vulkan = { workspace = true, optional = true }
ros_pointcloud2.workspace = true
anyhow.workspace = true
nalgebra.workspace = true
faer.workspace = true
rayon = { workspace = true, optional = true }
pelorus_localmap = { workspace = true, default-features = false }
log.workspace = true
serde.workspace = true
either.workspace = true

[features]
default = ["rayon", "threads"]
# The threaded synchronizer and the realtime predictor.
threads = ["pelorus_sync/threads"]
processing-time-export = []
rayon = [
    "dep:rayon",
    "pelorus_sync/rayon",
    "pelorus_localmap/rayon",
    "ros_pointcloud2/rayon",
    "faer/rayon",
    "pelorus_cuda?/rayon",
    "pelorus_vulkan?/rayon",
]
nn_kdt = ["pelorus_localmap/nn_kdt"]
os-rng-seed = ["pelorus_localmap/os-rng-seed"]
lru-eviction = ["pelorus_localmap/lru-eviction"]
plain-update = ["pelorus_localmap/plain-update"]
cuda = ["dep:pelorus_cuda", "pelorus_cuda/cuda_available", "pelorus_cuda/cuda_enable", "pelorus_sync/cuda"]
metal = ["dep:pelorus_metal", "pelorus_metal/metal_available", "pelorus_metal/metal_enable", "pelorus_sync/metal"]
vulkan = ["dep:pelorus_vulkan", "pelorus_vulkan/vulkan_available", "pelorus_vulkan/vulkan_enable", "pelorus_sync/vulkan"]

[dev-dependencies]
serde_json.workspace = true
